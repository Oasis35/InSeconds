services:
  api:
    build:
      context: ./src/back
      dockerfile: InSeconds.Api/Dockerfile.prod
    container_name: inseconds.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=shared-postgres;Port=5432;Database=inseconds;Username=inseconds;Password=${INSECONDS_DB_PASSWORD}"
      AdminPassword: ${ADMIN_PASSWORD}
      App__PublicUrl: https://inseconds.cc
      Resend__ApiKey: ${RESEND_API_KEY}
    networks:
      - shared-postgres
      - inseconds-internal
      - caddy-net

  front:
    build:
      context: ./src/front/InSeconds.Client
      dockerfile: Dockerfile.prod
      args:
        BUILD_TIME: ${BUILD_TIME}
    container_name: inseconds.front
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - inseconds-internal
      - caddy-net

networks:
  shared-postgres:
    external: true
  caddy-net:
    external: true
  inseconds-internal:
    driver: bridge
