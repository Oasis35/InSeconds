# Prod, déployée par deploy/vps/deploy.sh à chaque push sur main.
#
# Projet Compose `inseconds` (`inseconds-v2` de la bascule du 16/10/2026 jusqu'à I2 : deploy.sh retire une fois ses
# conteneurs). Conteneurs inseconds.api et inseconds.front, joints par Caddy sous ces noms. Base `inseconds`, un
# schéma par module.
# Variables dans .env.prod (non commité, cf. .env.prod.example).
name: inseconds

services:
  api:
    build:
      context: ./src/back
      dockerfile: InSeconds.Api/Dockerfile
    container_name: inseconds.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=shared-postgres;Port=5432;Database=inseconds;Username=inseconds;Password=${INSECONDS_DB_PASSWORD}"
      Brevo__ApiKey: ${BREVO_API_KEY}
      # Certificat qui chiffre les clés Data Protection (PLAN S16), chargé par l'API au démarrage.
      DataProtection__CertificatePath: /run/secrets/dataprotection.pfx
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?à renseigner dans .env.prod (mot de passe de secrets/dataprotection.pfx)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Signal healthchecks.io après chaque tâche planifiée (#315). Vide = aucun signal.
      Healthchecks__PingKey: ${HEALTHCHECKS_PING_KEY:-}
    volumes:
      # Hors du dépôt, à la racine du checkout (~/apps/InSeconds/secrets/), lisible par l'utilisateur de l'image
      # (uid/gid 1654), cf. .env.prod.example. deploy.sh vérifie sa présence et sa lecture avant de remplacer les conteneurs.
      - type: bind
        source: ./secrets/dataprotection.pfx
        target: /run/secrets/dataprotection.pfx
        read_only: true
        bind:
          create_host_path: false
    networks:
      - shared-postgres
      - internal
      - caddy-net

  front:
    build:
      context: ./src/front/InSeconds.Client
      dockerfile: Dockerfile.prod
      args:
        BUILD_CONFIGURATION: production
        # Heure du déploiement affichée en admin (piège 25) : exportée par deploy/vps/deploy.sh ; vide hors déploiement.
        BUILD_TIME: ${BUILD_TIME:-}
        # Content-Security-Policy du front (G3), posée à la construction de l'image : report-only (les violations sont
        # seulement remontées, rien n'est bloqué) le temps d'écarter la CSP des échecs de lecture d'extraits sur Android ;
        # enforce la rend bloquante (#300). Fixée ici, pas lue dans .env.prod. L'origine de l'API est celle de la prod
        # (défaut du Dockerfile).
        CSP_MODE: report-only
    container_name: inseconds.front
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal
      - caddy-net

networks:
  shared-postgres:
    external: true
  caddy-net:
    external: true
  internal:
    driver: bridge
