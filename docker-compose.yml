services:
  database:
    image: postgres:17-alpine
    container_name: inseconds.database
    environment:
      POSTGRES_DB: inseconds
      POSTGRES_USER: inseconds
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inseconds -d inseconds"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
