# Front v2 (PWA). Repris de la v1 (src/front/InSeconds.Client/nginx.conf), plus les fichiers du
# service worker servis sans cache. Vérifié par scripts/check-nginx-headers.sh (job CI nginx-headers-v2).

# Séparateur de query pour la redirection legacy : "?" si l'URL d'origine n'avait
# pas de query, "&" sinon — pour pouvoir y accoler `from=legacy` proprement.
map $args $legacy_qsep {
    ""      "?";
    default "&";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Ancienne adresse du front : 301 vers le nom de domaine, `from=legacy` ajouté pour que le front
    # affiche l'avis « l'adresse a changé » (repris tel quel de la v1).
    if ($host = "p01--front--b5cnx77tvxgb.code.run") {
        return 301 https://inseconds.cc$uri$is_args$args${legacy_qsep}from=legacy;
    }

    # Service worker : son manifeste (ngsw.json), le worker lui-même et ses variantes de secours
    # doivent toujours être revalidés, sinon un joueur peut rester bloqué sur une ancienne version
    # de la PWA. Déclaré avant la location des .js : nginx retient la première regex qui correspond,
    # et ngsw-worker.js prendrait sinon le cache immuable des bundles.
    # Désactiver le service worker chez tous les joueurs : servir safety-worker.js à la place de
    # ngsw-worker.js (cf. src/v2/front/CLAUDE.md § PWA).
    location ~ ^/(?:ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Bundles hashés (outputHashing "all") : cache long et immuable, une nouvelle version a toujours
    # une nouvelle URL.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Traductions (non hashées) : toujours revalider (incident du 2026-08-15, piège 20).
    location /i18n/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html (servi aussi pour les routes SPA) : jamais de cache dur, il référence les noms
    # hashés des bundles courants.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
