# En-têtes de sécurité, inclus dans chaque location de nginx.conf : nginx n'hérite pas des add_header
# du niveau `server` dès qu'une location définit les siens (ici Cache-Control).
# La Content-Security-Policy est dans csp.conf (généré au build depuis csp.conf.template, cf. Dockerfile.prod).
include /etc/nginx/snippets/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
