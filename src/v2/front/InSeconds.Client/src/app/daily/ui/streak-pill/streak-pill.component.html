@let mode = pillMode();
<button type="button" (click)="open.emit()"
        data-testid="streak-pill"
        [attr.data-mode]="mode"
        [attr.data-anim]="animation() ? '' : null"
        [style.animation]="animation()"
        [attr.aria-label]="mode === 'protected' ? ('daily.streakFreeze.pillProtectedLabel' | translate) : (labelKey() | translate: { streak: streak()?.streak ?? 0 })"
        class="flex items-center gap-[7px] h-[30px] px-2.5 rounded-full text-xs font-bold tabular-nums whitespace-nowrap cursor-pointer"
        [style]="mode === 'protected'
          ? 'font-family:var(--font-display);border:1px solid rgb(var(--rgb-accent-2) / 0.75);background:rgb(var(--rgb-accent-2) / 0.08)'
          : mode === 'lost'
            ? 'font-family:var(--font-display);border:1px solid rgb(var(--rgb-border) / 0.2);background:rgb(var(--rgb-panel) / 0.35);color:var(--text-muted)'
            : 'font-family:var(--font-display);border:1px solid rgb(var(--rgb-border) / 0.25);background:rgb(var(--rgb-panel) / 0.5)'">
  @if (mode === 'lost') {
    <span class="flex" style="color:var(--color-accent-3);filter:grayscale(1);opacity:.6"><app-streak-icon name="flame" /></span>0
  } @else {
    <span class="flex items-center gap-1" style="color:var(--color-accent-3)">
      <app-streak-icon name="flame" />{{ streak()?.streak }}
    </span>
    @if (mode === 'on' || mode === 'protected') {
      <span style="width:1px;height:12px;background:rgb(var(--rgb-border) / 0.45)"></span>
      <span class="flex items-center gap-1" style="color:var(--color-accent-2)">
        <app-streak-icon name="snowflake" />{{ streak()?.freezes }}
      </span>
    }
  }
</button>
