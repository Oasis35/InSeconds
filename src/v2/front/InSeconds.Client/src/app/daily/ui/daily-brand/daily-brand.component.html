<!-- Trois colonnes : la gélule de série (ou le score) à gauche, le titre au centre, le lien de compte à droite, posés par la page
     (`[brandLeft]`, `[brandRight]`). Les deux colonnes de côté se partagent la place : le titre reste centré tant qu'elles tiennent, et
     se décale plutôt que d'être recouvert quand l'une s'élargit (série à deux chiffres, petit écran). -->
<div class="grid items-center gap-2 py-2 px-2 rounded-2xl" style="grid-template-columns:1fr auto 1fr;background:rgb(var(--rgb-surface) / 0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border-medium)">
  <div class="flex items-center justify-start" data-testid="brand-left"><ng-content select="[brandLeft]" /></div>
  <h1 class="brand-title font-extrabold uppercase whitespace-nowrap" style="font-family:var(--font-display);color:var(--text-hi)">
    IN<span style="color:var(--text-accent)">//</span>SECONDS
  </h1>
  <div class="flex items-center justify-end" data-testid="brand-right"><ng-content select="[brandRight]" /></div>
</div>
