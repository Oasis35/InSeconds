<div role="dialog" aria-modal="true" aria-labelledby="legacy-url-title" class="fixed inset-0 flex items-center justify-center px-4" style="background:var(--overlay-dark);z-index:60">
  <div class="w-full max-w-md rounded-2xl p-6 space-y-4 text-center"
    style="background:var(--bg-surface-2);border:1px solid var(--border-strong);color:var(--text-body)">
    <p class="text-5xl" aria-hidden="true">🔖</p>
    <p id="legacy-url-title" class="text-base font-bold uppercase" style="font-family:var(--font-display);letter-spacing:0.04em;color:var(--text-hi)">
      {{ 'shell.legacyUrl.title' | translate }}
    </p>
    <p class="text-sm leading-relaxed" style="color:var(--text-light)">
      {{ 'shell.legacyUrl.body' | translate }}
    </p>
    <p class="text-lg font-bold tracking-wide" style="font-family:var(--font-display);color:var(--text-accent)">
      inseconds.cc
    </p>
    <button appButton type="button" [block]="true" (click)="dismissed.emit()">
      {{ 'shell.legacyUrl.cta' | translate }}
    </button>
  </div>
</div>
