<!--
  Trois lignes pleine largeur, une par difficulté : le nom et ce qu'un morceau rapporte au plus à gauche, le niveau en barres, l'objectif à droite.
  Une ligne se touche pour la choisir et lancer la manche (cibles larges, tout tient sans défilement sur un petit téléphone).
-->
<div class="flex flex-col gap-2.5">
  @for (column of columns(); track column.option.difficulty) {
    <button type="button" class="flex items-center gap-3.5 px-4 text-left touch-manipulation" style="min-height:88px;background:var(--bg-surface);border-style:solid;border-width:1.5px;border-radius:var(--radius-card)" [disabled]="busy()"
      (click)="selected.set(column.option.difficulty); picked.emit(column.option.difficulty)" [attr.data-testid]="'run-difficulty-' + column.option.difficulty"
      [attr.aria-pressed]="selected() === column.option.difficulty"
      [style.border-color]="selected() === column.option.difficulty ? 'var(--color-accent)' : 'var(--border-strong)'"
      [attr.aria-label]="('runs.difficulty.columnLabel' | translate: {
        name: ('runs.difficulty.' + column.option.difficulty | translate), perTrack: column.perTrack, objective: column.option.objective })
        + (column.option.listenSeconds < listenSeconds() ? ', ' + ('runs.difficulty.listen' | translate: { seconds: (column.option.listenSeconds | appSeconds) }) : '')">
      <span class="flex-1 min-w-0 flex flex-col gap-0.5">
        <span class="text-[19px] font-extrabold leading-tight" style="font-family:var(--font-display)"
          [style.color]="selected() === column.option.difficulty ? 'var(--color-accent)' : 'var(--text-hi)'">{{ 'runs.difficulty.' + column.option.difficulty | translate }}</span>
        <span class="text-[12px] leading-tight whitespace-pre-line" style="font-family:var(--font-clock);color:var(--text-light)"
          data-testid="run-difficulty-per-track">{{ 'runs.difficulty.perTrack' | translate: { points: column.perTrack } }}</span>
        @if (column.option.listenSeconds < listenSeconds()) {
          <span class="text-[12px] leading-tight" style="color:var(--text-light)" data-testid="run-difficulty-boss">
            {{ 'runs.difficulty.listen' | translate: { seconds: (column.option.listenSeconds | appSeconds) } }}
          </span>
        }
      </span>
      <span class="flex items-end gap-[3px]" aria-hidden="true">
        @for (level of levels; track level) {
          <span class="w-[5px] rounded-[1px]" [style.height.px]="6 + level * 4"
            [style.background]="level <= column.level ? 'var(--text-hi)' : 'var(--border-strong)'"></span>
        }
      </span>
      <span class="flex items-center gap-1.5 pl-1.5" style="color:var(--color-accent)" data-testid="run-difficulty-objective">
        <svg width="12" height="14" viewBox="0 0 10 12" aria-hidden="true">
          <rect x="1" y="5" width="8" height="6" rx="1" fill="currentColor" />
          <path d="M3 5 V3.5 a2 2 0 0 1 4 0 V5" stroke="currentColor" stroke-width="1.4" fill="none" />
        </svg>
        <span class="text-[24px] font-extrabold leading-none" style="font-family:var(--font-clock)">{{ column.option.objective }}</span>
      </span>
    </button>
  }
</div>
