<section class="flex-1 flex flex-col" data-testid="run-difficulty">
  <h1 class="text-[24px] font-extrabold leading-tight mt-3" style="font-family:var(--font-display);color:var(--text-hi)">
    {{ 'runs.difficulty.round' | translate: { round: round() } }}
  </h1>
  <p class="text-[22px] font-extrabold leading-tight" style="font-family:var(--font-display);color:var(--color-accent)">
    {{ 'runs.difficulty.title' | translate }}
  </p>
  <p class="flex items-baseline gap-3 mt-2">
    <span class="text-[15px]" style="color:var(--text-light)">{{ 'runs.difficulty.yourScore' | translate }}</span>
    <span class="text-[28px] font-extrabold leading-none" style="font-family:var(--font-score);color:var(--text-hi)" data-testid="run-difficulty-score">{{ totalScore() }}</span>
  </p>

  <div class="flex-1 min-h-4"></div>
  <app-run-difficulty-columns [options]="options()" [tracksPerRound]="tracksPerRound()" [listenSeconds]="listenSeconds()"
    [selected]="effective()" (selectedChange)="selected.set($event)" (picked)="choose.emit($event)" [busy]="busy()" />

  <div class="flex-1 min-h-4"></div>
</section>
