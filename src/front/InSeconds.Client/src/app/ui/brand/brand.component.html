<!-- Logo à gauche, ce que la page pose à droite (`[brandRight]` : les accès du compte, ou le score en pleine manche). Ni fond ni flou :
     la barre est posée sur la grille et défile avec la page. -->
<div class="flex items-center justify-between gap-3 min-h-11">
  @if (homeLink()) {
    <a routerLink="/daily" class="brand-title font-extrabold uppercase whitespace-nowrap" style="font-family:var(--font-display);color:var(--text-hi)">
      IN<span style="color:var(--text-accent)">//</span>SECONDS
    </a>
  } @else {
    <h1 class="brand-title font-extrabold uppercase whitespace-nowrap" style="font-family:var(--font-display);color:var(--text-hi)">
      IN<span style="color:var(--text-accent)">//</span>SECONDS
    </h1>
  }
  <div class="flex items-center justify-end gap-2" data-testid="brand-right"><ng-content select="[brandRight]" /></div>
</div>
