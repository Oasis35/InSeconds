<div class="flex items-start justify-between gap-4">
  <h2 [id]="titleId" class="text-base font-bold uppercase" style="letter-spacing:0.04em;color:var(--text-hi)">
    {{ title() }}
  </h2>
  <button type="button" (click)="close()" [attr.aria-label]="'common.close' | translate"
    class="shrink-0 w-8 h-8 -mt-1 -mr-1 rounded-full flex items-center justify-center hover:bg-white/10"
    style="color:var(--text-muted)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
</div>
<div class="mt-3 text-sm leading-relaxed" style="color:var(--text-body)">
  <ng-content />
</div>
<ng-content select="[modalActions]" />
