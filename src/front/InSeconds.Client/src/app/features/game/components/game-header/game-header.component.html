<header class="pt-3 pb-6">
  <div class="sticky top-2 z-10 flex items-center justify-center relative py-3 px-4 rounded-2xl"
       style="background:rgb(var(--rgb-surface) / 0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border-medium)">
    <h1 class="text-base font-extrabold tracking-widest uppercase" style="font-family:var(--font-display);color:var(--text-hi);letter-spacing:0.14em">
      IN<span style="color:var(--text-accent)">//</span>SECONDS
    </h1>

    <!-- Gélule série / gels (tous les écrans sauf loading / playing) — ouvre le panneau série -->
    @if (showStreak()) {
      @let mode = pillMode();
      <button type="button" (click)="openStreak.emit()"
              data-testid="streak-pill"
              [attr.data-mode]="mode"
              [attr.data-anim]="pillAnimation() ? '' : null"
              [style.animation]="pillAnimation()"
              [attr.aria-label]="mode === 'protected' ? ('streakFreeze.pillProtectedLabel' | translate) : ('streakFreeze.pillLabel' | translate: { streak: streak()?.streak ?? 0 })"
              class="absolute left-2 flex items-center gap-[7px] h-[30px] px-2.5 rounded-full text-xs font-bold tabular-nums whitespace-nowrap cursor-pointer"
              [style]="mode === 'protected'
                ? 'font-family:var(--font-display);border:1px solid rgb(var(--rgb-accent-2) / 0.75);background:rgb(var(--rgb-accent-2) / 0.08)'
                : mode === 'lost'
                  ? 'font-family:var(--font-display);border:1px solid rgb(var(--rgb-border) / 0.2);background:rgb(var(--rgb-panel) / 0.35);color:var(--text-muted)'
                  : 'font-family:var(--font-display);border:1px solid rgb(var(--rgb-border) / 0.25);background:rgb(var(--rgb-panel) / 0.5)'">
        @if (mode === 'lost') {
          <span class="flex" style="color:var(--color-accent-3);filter:grayscale(1);opacity:.6"><app-streak-icon name="flame" /></span>0
        } @else {
          <span class="flex items-center gap-1" style="color:var(--color-accent-3)">
            <app-streak-icon name="flame" />{{ streak()?.streak }}
          </span>
          @if (mode === 'on' || mode === 'protected') {
            <span style="width:1px;height:12px;background:rgb(var(--rgb-border) / 0.45)"></span>
            <span class="flex items-center gap-1" style="color:var(--color-accent-2)">
              <app-streak-icon name="snowflake" />{{ streak()?.freezes }}
            </span>
          }
        }
      </button>
    }

    <!-- Score en cours de partie (par-dessus streak si playing) -->
    @if (playing()) {
      <span class="absolute left-4 text-base font-extrabold tabular-nums" style="font-family:var(--font-display);color:var(--text-hi)">
        {{ totalScore() }} <span style="color:var(--text-faint);font-weight:400;font-size:0.625rem">{{ 'common.points' | translate }}</span>
      </span>
    }

    <!-- Avatar profil (compte connecté, hors partie) -->
    @if (playerSession.isLinked() && !playing()) {
      <a routerLink="/profile"
         [title]="'streakFreeze.avatarTitle' | translate: { pseudo: playerSession.pseudo() ?? '' }"
         [attr.aria-label]="'streakFreeze.avatarLabel' | translate"
         class="absolute right-2 flex items-center justify-center rounded-full text-white"
         style="width:32px;height:32px;background:var(--gradient-primary);box-shadow:var(--glow-primary)">
        <app-streak-icon name="user" size="16" />
      </a>
    }
  </div>
  @if (playing()) {
    <div class="mt-4 space-y-1.5">
      <div class="flex justify-between text-xs font-semibold" style="color:var(--text-faint)">
        <span>{{ 'header.track' | translate: { current: currentIndex() + 1, total: trackCount() } }}</span>
        <button (click)="abandon.emit()"
                class="text-xs underline transition-colors hover:text-red-400"
                style="color:var(--text-muted)">
          {{ 'common.abandon' | translate }}
        </button>
      </div>
      <div class="w-full rounded-full" style="height:3px;background:var(--bg-inactive)">
        <div class="rounded-full transition-all duration-500" style="height:3px;background:linear-gradient(90deg,var(--text-streak),var(--text-accent))"
          [style.width.%]="(currentIndex() + 1) / trackCount() * 100">
        </div>
      </div>
    </div>
  }
</header>
