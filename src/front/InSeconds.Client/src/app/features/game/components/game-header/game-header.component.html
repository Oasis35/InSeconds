<header class="pt-3 pb-6">
  <div class="sticky top-2 z-10 flex items-center justify-center relative py-3 px-4 rounded-2xl"
       style="background:rgb(var(--rgb-surface) / 0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border-medium)">
    <h1 class="text-base font-extrabold tracking-widest uppercase" style="font-family:var(--font-display);color:var(--text-hi);letter-spacing:0.14em">
      IN<span style="color:var(--text-accent)">//</span>SECONDS
    </h1>

    <!-- Streak header (tous les écrans sauf loading / playing) -->
    @if (showStreak()) {
      <span class="absolute right-4 flex items-center gap-1 text-xs font-bold tabular-nums"
            style="font-family:var(--font-display);color:var(--text-streak)">
        🔥 {{ streak() }}
      </span>
    }

    <!-- Score en cours de partie (par-dessus streak si playing) -->
    @if (playing()) {
      <span class="absolute right-4 text-base font-extrabold tabular-nums" style="font-family:var(--font-display);color:var(--text-hi)">
        {{ totalScore() }} <span style="color:var(--text-faint);font-weight:400;font-size:0.625rem">{{ 'common.points' | translate }}</span>
      </span>
    }
  </div>
  @if (playing()) {
    <div class="mt-4 space-y-1.5">
      <div class="flex justify-between text-xs font-semibold" style="color:var(--text-faint)">
        <span>{{ 'header.track' | translate: { current: currentIndex() + 1, total: trackCount() } }}</span>
        <button (click)="abandon.emit()"
                class="text-xs underline transition-colors hover:text-red-400"
                style="color:var(--text-muted)">
          {{ 'common.abandon' | translate }}
        </button>
      </div>
      <div class="w-full rounded-full" style="height:3px;background:var(--bg-inactive)">
        <div class="rounded-full transition-all duration-500" style="height:3px;background:linear-gradient(90deg,var(--text-streak),var(--text-accent))"
          [style.width.%]="(currentIndex() + 1) / trackCount() * 100">
        </div>
      </div>
    </div>
  }
</header>
