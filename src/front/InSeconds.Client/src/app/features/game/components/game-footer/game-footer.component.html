<footer class="flex justify-center items-center gap-4 py-3 mt-auto">
  <a routerLink="/admin" class="transition-colors hover:text-slate-500" style="color:var(--text-faint)" [title]="'footer.admin' | translate">
    <svg fill="currentColor" width="14" height="14" viewBox="0 0 574.65 574.65" xmlns="http://www.w3.org/2000/svg">
      <path d="M424.94,217.315v-79.656C424.94,61.755,363.185,0,287.291,0S149.658,61.739,149.658,137.623v79.742c-41.326,28.563-68.46,76.238-68.46,130.287v162.264c0,35.748,28.986,64.734,64.733,64.734h282.787c35.748,0,64.734-28.986,64.734-64.734V347.652C493.456,293.574,466.306,245.892,424.94,217.315z M322.136,421.457v49.314c0,19.221-15.577,34.811-34.808,34.811c-19.23,0-34.829-15.59-34.829-34.83v-49.283c-14.155-10.627-23.441-27.385-23.441-46.447c0-32.174,26.102-58.254,58.252-58.254c32.173,0,58.255,26.084,58.255,58.254C345.563,394.084,336.276,410.832,322.136,421.457z M348.241,189.969c-4.344-0.357-8.707-0.665-13.145-0.665h-95.538c-4.456,0-8.837,0.308-13.201,0.665v-52.346c0-33.595,27.338-60.922,60.933-60.922c33.612,0,60.95,27.348,60.95,60.959V189.969L348.241,189.969z"/>
    </svg>
  </a>
  <span style="color:var(--text-sep)">·</span>
  <a routerLink="/privacy" class="transition-colors hover:text-slate-500" style="color:var(--text-faint)" [title]="'footer.privacy' | translate">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0 2.25 4.125v6c0 6.15 4.16 11.9 9.75 13.875 5.59-1.975 9.75-7.725 9.75-13.875v-6L12 0zm7.5 10.125c0 4.83-3.19 9.44-7.5 11.25-4.31-1.81-7.5-6.42-7.5-11.25V5.59L12 2.44l7.5 3.15v4.535zM8.56 11.44 7.5 12.5l3.25 3.25 5.75-5.75-1.06-1.06-4.69 4.69-2.19-2.19z"/>
    </svg>
  </a>
  <span style="color:var(--text-sep)">·</span>
  <a href="mailto:contact@inseconds.cc" class="transition-colors hover:text-slate-500" style="color:var(--text-faint)" [title]="'footer.contact' | translate">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </svg>
  </a>
  <span style="color:var(--text-sep)">·</span>
  <button type="button" (click)="onLoginIconClick()" class="transition-colors hover:text-slate-500" style="color:var(--text-faint)" [title]="loginTooltip()" [attr.aria-label]="loginTooltip()">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
  </button>
  <span style="color:var(--text-sep)">·</span>
  <button type="button" (click)="toggleLanguage()"
          class="flex items-center gap-1.5 transition-colors cursor-pointer rounded-full"
          style="color:var(--color-accent-2);background:rgb(var(--rgb-accent-2) / 0.1);border:1px solid rgb(var(--rgb-accent-2) / 0.35);padding:5px 10px 5px 8px"
          [title]="'footer.language' | translate">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M2 12h20"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    <span class="text-xs font-bold uppercase leading-none" style="font-family:var(--font-display);letter-spacing:0.06em">{{ currentLang() }}</span>
  </button>
</footer>
