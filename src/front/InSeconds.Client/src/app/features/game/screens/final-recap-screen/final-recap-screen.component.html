<div class="screen-enter flex-1 flex flex-col pt-4 gap-4">

  <!-- Card unique -->
  <div class="overflow-hidden" style="background:var(--bg-surface);border:1px solid var(--border-medium);border-radius:28px 8px 28px 8px">

    <!-- Score -->
    <div class="px-6 pt-7 pb-6 text-center">
      <p class="text-xs font-bold tracking-widest uppercase mb-3" style="font-family:var(--font-display);color:var(--text-faint)">{{ 'done.finalScore' | translate }}</p>
      <p class="font-extrabold tabular-nums" style="font-family:var(--font-display);color:var(--text-hi);font-size:4rem;line-height:1;letter-spacing:-0.03em">{{ displayedScore() }}</p>
      <p class="text-xs mt-2" style="color:var(--text-faint)">{{ 'done.points' | translate }}</p>
    </div>

    <!-- Compte à rebours -->
    @if (countdown()) {
      <div class="px-6 py-5 text-center" style="border-top:1px solid var(--border-medium)">
        <p class="text-xs font-bold tracking-widest uppercase mb-1" style="font-family:var(--font-display);color:var(--text-faint)">{{ 'alreadyPlayed.nextChallengeIn' | translate }}</p>
        <p class="text-2xl font-bold tabular-nums" style="font-family:var(--font-display);color:var(--text-body);letter-spacing:0.05em">{{ countdown() }}</p>
      </div>
    }

    <!-- Bouton partage -->
    <div class="px-4 py-4" style="border-top:1px solid var(--border-medium)">
      <app-share-button [copied]="shareCopied()" [failed]="shareFailed()" [disabled]="!canShare()" (share)="share.emit()" />
    </div>

    <!-- Accordéon morceaux -->
    <button (click)="showTrackDetails.set(!showTrackDetails())"
      class="w-full flex items-center justify-center gap-2 py-3.5 text-xs font-bold tracking-wide uppercase transition-colors hover:text-slate-400"
      style="font-family:var(--font-display);color:var(--text-faint);border-top:1px solid var(--border-medium)">
      <span>{{ (showTrackDetails() ? 'alreadyPlayed.hideTracks' : 'alreadyPlayed.showTracks') | translate }}</span>
      <span>{{ showTrackDetails() ? '▲' : '▼' }}</span>
    </button>

    @if (showTrackDetails()) {
      <div style="border-top:1px solid var(--border-medium)">
        <app-track-results-list [rows]="recapRows()" />
      </div>
    }

  </div>

  <p class="text-center text-xs pb-4" style="color:var(--text-muted)">{{ 'done.comeBack' | translate }}</p>
</div>
