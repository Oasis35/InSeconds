<div class="screen-enter flex-1 flex flex-col items-center justify-center gap-8 text-center px-4">
  @if (!showAbandonConfirm()) {
    <div class="space-y-3">
      <p class="text-5xl" style="line-height:1">⏸</p>
      <h2 class="text-2xl font-bold tracking-tight" style="font-family:var(--font-display);color:var(--text-hi)">{{ 'resume.title' | translate }}</h2>
      <p class="text-sm leading-relaxed" style="color:var(--text-muted)">
        {{ 'resume.progress' | translate: { done: completedCount(), total: trackCount() } }}<br>
        {{ 'resume.question' | translate }}
      </p>
    </div>

    <div class="w-full flex flex-col gap-3">
      <button (click)="resumeGame.emit()"
        class="w-full py-4 rounded-2xl font-bold text-base tracking-wide uppercase transition-all active:scale-95 touch-manipulation"
        style="font-family:var(--font-display);background:var(--gradient-primary);color:var(--text-on-primary);letter-spacing:0.06em;box-shadow:var(--glow-primary)">
        {{ 'resume.resume' | translate }}
      </button>
      <button (click)="showAbandonConfirm.set(true)"
        class="w-full py-3 rounded-2xl text-sm font-semibold transition-all active:scale-95"
        style="background:var(--bg-inactive);color:var(--text-slate);border:1px solid var(--border-subtle)">
        {{ 'common.abandon' | translate }}
      </button>
    </div>
  } @else {
    <div class="w-full rounded-2xl p-6 space-y-4" style="background:rgb(var(--rgb-danger) / 0.1);border:1px solid rgb(var(--rgb-danger) / 0.35)">
      <p class="text-sm font-bold" style="font-family:var(--font-display);color:var(--text-error)">{{ 'resume.warningTitle' | translate }}</p>
      <p class="text-sm leading-relaxed" style="color:var(--text-body);white-space:pre-line">{{ 'resume.warningBody' | translate }}</p>
      <div class="flex gap-3 pt-1">
        <button (click)="abandon.emit()"
          [disabled]="abandonLoading()"
          class="flex-1 py-3 rounded-xl text-sm font-bold uppercase transition-all active:scale-95"
          style="font-family:var(--font-display);letter-spacing:0.06em;background:var(--bg-danger);color:var(--text-on-primary)">
          {{ abandonLoading() ? '…' : ('resume.confirmAbandon' | translate) }}
        </button>
        <button (click)="showAbandonConfirm.set(false)"
          class="flex-1 py-3 rounded-xl text-sm font-bold uppercase transition-all active:scale-95"
          style="font-family:var(--font-display);letter-spacing:0.06em;background:var(--bg-surface);color:var(--text-body);border:1px solid var(--border-subtle)">
          {{ 'resume.cancelAbandon' | translate }}
        </button>
      </div>
    </div>
  }
</div>
