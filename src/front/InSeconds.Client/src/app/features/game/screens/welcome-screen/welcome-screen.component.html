<div class="screen-enter relative flex-1 flex flex-col items-center justify-center gap-10 text-center px-2">
  <div class="relative space-y-4">
    <p class="text-6xl" style="line-height:1;color:var(--color-accent)">♪</p>
    <h2 class="text-3xl font-extrabold tracking-tight" style="font-family:var(--font-display);color:var(--text-hi)">{{ 'welcome.title' | translate }}</h2>
    <p class="text-sm leading-relaxed" style="color:var(--text-muted)">
      {{ 'welcome.subtitle' | translate: { count: trackCount() } }}<br>
      {{ 'welcome.tagline' | translate }}
    </p>
  </div>

  <button
    (click)="startGame.emit()"
    class="relative w-full max-w-[280px] py-4.5 rounded-full font-bold text-base tracking-wide uppercase transition-all active:scale-95 touch-manipulation"
    style="font-family:var(--font-display);background:var(--gradient-primary);color:var(--text-on-primary);letter-spacing:0.06em;box-shadow:var(--glow-primary)">
    {{ 'welcome.start' | translate }}
  </button>
</div>
