@if (!isLinked()) {
  <div class="rounded-xl p-8 flex flex-col items-center gap-4 w-full max-w-md text-center" style="background:var(--bg-surface)">
    <h2 class="text-lg font-semibold" style="color:var(--text-hi)">{{ 'admin.notLoggedIn' | translate }}</h2>
    <p class="text-sm" style="color:var(--text-muted)">{{ 'admin.notLoggedInBody' | translate }}</p>
    <a routerLink="/login"
      class="w-full font-semibold py-3 rounded-lg transition-colors text-center"
      style="background:var(--bg-primary);color:var(--text-on-primary)">
      {{ 'admin.goToLogin' | translate }}
    </a>
  </div>
} @else {
  <div class="rounded-xl p-8 flex flex-col items-center gap-4 w-full max-w-md text-center" style="background:var(--bg-surface)">
    <h2 class="text-lg font-semibold" style="color:var(--text-hi)">{{ 'admin.accessDenied' | translate }}</h2>
    <p class="text-sm" style="color:var(--text-muted)">{{ 'admin.accessDeniedBody' | translate }}</p>
  </div>
}
<a routerLink="/" class="text-sm transition-colors text-center w-full block mt-4" style="color:var(--text-faint)">{{ 'admin.backToGame' | translate }}</a>
