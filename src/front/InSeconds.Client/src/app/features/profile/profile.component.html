<div class="da-bg min-h-dvh flex flex-col items-center p-6 relative" style="color:var(--text-body)">
  <app-decor-background />

  <div class="w-full max-w-sm py-8 screen-enter flex flex-col gap-6">
    <h1 class="text-2xl font-bold text-center" style="font-family:var(--font-display);color:var(--text-hi)">{{ 'profile.title' | translate }}</h1>

    <!-- Pseudo -->
    <div>
      <div class="flex gap-2">
        <label for="profile-pseudo" class="sr-only">{{ 'profile.pseudoPlaceholder' | translate }}</label>
        <input
          id="profile-pseudo"
          [ngModel]="pseudoDraft()"
          (ngModelChange)="onPseudoInput($event)"
          name="pseudo"
          autocomplete="off"
          [placeholder]="'profile.pseudoPlaceholder' | translate"
          class="flex-1 min-w-0 px-4 py-3.5 rounded-xl text-sm transition"
          style="background:var(--bg-inactive);color:var(--text-body);border:1px solid var(--border-strong);outline:none"
        />
        <button
          type="button"
          (click)="savePseudo()"
          [disabled]="saveDisabled()"
          class="flex-shrink-0 px-4.5 rounded-xl font-bold text-xs uppercase transition-all active:scale-95 disabled:active:scale-100"
          [style.cursor]="saveDisabled() ? 'default' : 'pointer'"
          [style.color]="saveDisabled() ? 'var(--text-muted)' : 'var(--text-on-primary)'"
          [style.background]="saveDisabled() ? 'var(--bg-inactive)' : 'var(--gradient-primary)'"
          [style.box-shadow]="saveDisabled() ? 'none' : 'var(--glow-primary)'"
          style="font-family:var(--font-display);letter-spacing:0.06em">
          {{ saveLabel() }}
        </button>
      </div>
      <p class="text-xs mt-2" [style.color]="hintIsError() ? 'var(--text-error)' : 'var(--text-muted)'">{{ hint() }}</p>
    </div>

    <p class="text-sm text-center truncate" style="color:var(--text-muted)">{{ email() }}</p>

    <!-- Stats -->
    <div class="grid grid-cols-2 rounded-2xl overflow-hidden" style="background:var(--bg-surface);border:1px solid var(--border-medium)">
      <div class="flex flex-col items-center py-4.5 px-3 text-center" style="border-right:1px solid var(--border-medium)">
        <p class="text-xs font-bold tracking-widest uppercase mb-1.5" style="font-family:var(--font-display);color:var(--text-muted)">{{ 'profile.streakLabel' | translate }}</p>
        <p class="text-2xl font-extrabold tabular-nums" style="font-family:var(--font-display);color:var(--text-streak)">{{ streak() }}</p>
      </div>
      <div class="flex flex-col items-center py-4.5 px-3 text-center">
        <p class="text-xs font-bold tracking-widest uppercase mb-1.5" style="font-family:var(--font-display);color:var(--text-muted)">{{ 'profile.gamesPlayedLabel' | translate }}</p>
        <p class="text-2xl font-extrabold tabular-nums" style="font-family:var(--font-display);color:var(--text-hi)">{{ gamesPlayed() }}</p>
      </div>
    </div>

    <div class="flex flex-col gap-2.5 mt-1">
      <button
        type="button"
        (click)="askLogout()"
        class="w-full py-3.5 rounded-xl font-bold text-xs uppercase transition-all active:scale-95"
        style="font-family:var(--font-display);letter-spacing:0.08em;background:rgb(var(--rgb-danger) / 0.08);color:var(--text-error);border:1px solid rgb(var(--rgb-danger) / 0.5)">
        {{ 'profile.logout' | translate }}
      </button>
      <a routerLink="/" class="w-full text-center text-sm py-2" style="color:var(--text-faint)">{{ 'profile.backToGame' | translate }}</a>
    </div>
  </div>

  @if (showLogoutConfirm()) {
    <app-confirm-sheet
      tone="danger"
      [title]="'profile.logoutConfirmTitle' | translate"
      [body]="'profile.logoutConfirmBody' | translate: { email: email() }"
      [confirmLabel]="'profile.logoutConfirmAction' | translate"
      [cancelLabel]="'profile.logoutCancel' | translate"
      [loading]="loggingOut()"
      (confirm)="confirmLogout()"
      (cancelled)="cancelLogout()" />
  }
</div>
