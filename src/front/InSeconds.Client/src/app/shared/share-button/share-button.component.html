<div class="flex flex-col items-center gap-1.5 w-full">
  <button
    (click)="share.emit()"
    [disabled]="disabled()"
    class="w-full py-3.5 rounded-full font-bold text-sm tracking-wide transition touch-manipulation disabled:opacity-40"
    style="background:var(--bg-primary);color:var(--text-on-primary);letter-spacing:0.02em;box-shadow:0 10px 24px rgba(255,155,122,0.28)">
    {{ (copied() ? 'share.copied' : 'share.button') | translate }}
  </button>
  @if (failed()) {
    <p class="text-xs" style="color:var(--text-error)">{{ 'share.failed' | translate }}</p>
  } @else {
    <p class="text-xs" style="color:var(--text-muted)">{{ 'share.hint' | translate }}</p>
  }
</div>
