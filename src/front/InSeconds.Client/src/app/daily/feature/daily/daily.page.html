<div class="da-bg min-h-dvh flex flex-col relative" style="color:var(--text-body)">
  <app-decor-background />

  <main class="relative flex-1 flex flex-col px-5 pt-2 pb-5 w-full max-w-lg mx-auto overflow-x-clip">

    <header class="pb-6">
      <!-- Ni accès du compte ni lien légal sur cette page : en pleine manche, un toucher par erreur ouvrirait la confirmation de sortie, et
           pendant le chargement la page n'a rien d'autre à montrer. Le total de la partie se lit à la révélation de chaque morceau. -->
      <app-brand />
      @if (store.isPlaying()) {
        <app-daily-progress [currentIndex]="store.currentIndex()" [trackCount]="store.trackCount()" (abandon)="confirmAbandon()">
          <!-- Le total de la partie se lit ici, à côté du numéro du morceau, une fois le morceau révélé : il monte des points du morceau quand ceux-ci sont comptés. -->
          @if (store.roundResult()) {
            <span progressTotal class="ml-2 whitespace-nowrap" style="color:var(--text-hi)">· {{ 'daily.round.total' | translate }}
              <b data-testid="round-total" class="tabular-nums" style="font-family:var(--font-score);font-weight:900"><app-score-count [value]="store.totalScore()" [from]="store.totalScore() - store.roundScore()" [delay]="store.roundBreakdown() ? 1650 : 650" /></b>
            </span>
          }
        </app-daily-progress>
      }
    </header>

    @switch (screen()) {
      @case ('loading') {
        <div class="flex-1 flex items-center justify-center">
          <p class="text-sm animate-pulse" style="color:var(--text-faint)">{{ 'daily.common.loading' | translate }}</p>
        </div>
      }

      @case ('playing') {
        <div class="screen-enter flex-1 flex flex-col justify-start pt-4">
          <app-track-round [result]="store.roundResult()" [hintPending]="store.hintPending()"
            (answered)="onAnswered($event)" (hintRequested)="store.requestHint($event)">
            <!-- Le badge Deezer se pose sous « Artiste - Titre », dans le flux. -->
            <div roundBadge class="inline-flex items-center justify-center rounded-xl px-2.5"
                 style="height:30px;background:var(--bg-surface);backdrop-filter:var(--blur-tile);-webkit-backdrop-filter:var(--blur-tile);border:1px solid var(--border-medium)">
              <app-deezer-badge [deezerTrackId]="store.roundDeezerTrackId() ?? undefined" width="98" height="14" [lang]="language.current()" />
            </div>

            <div roundScore class="flex flex-col items-start gap-2">
              <p data-testid="round-score" class="tabular-nums"
                 style="font-family:var(--font-score);font-size:2.2rem;font-weight:900;line-height:0.95;letter-spacing:-0.02em"
                 [style.color]="store.roundScore() > 0 ? 'var(--text-hi)' : 'var(--text-muted)'">
                +<app-score-count [value]="store.roundScore()" [from]="store.roundBreakdown()?.base ?? 0" [delay]="store.roundBreakdown() ? 1000 : 0" />
                <span class="text-sm font-normal" style="font-family:var(--font-body);letter-spacing:0;color:var(--text-muted)"> {{ 'daily.round.points' | translate }}</span>
              </p>
              <!-- D'où viennent les points : le barème du palier, puis la moitié ou l'indice qui les réduit (pastilles visibles) ; le score descend ensuite jusqu'à son résultat. -->
              <app-score-breakdown [breakdown]="store.roundBreakdown()" />
            </div>

            <button appButton roundNext type="button" [block]="true" (click)="nextTrack()">
              {{ (store.isLastTrack() ? 'daily.round.seeResult' : 'daily.round.nextTrack') | translate }}
            </button>
          </app-track-round>
        </div>
      }
    }

  </main>
</div>
