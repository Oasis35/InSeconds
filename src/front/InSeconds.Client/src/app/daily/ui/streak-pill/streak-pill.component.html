@let mode = pillMode();
<!-- Un simple relevé sous « Commencer » : rien tant qu'aucune série n'est en cours. -->
@if (mode !== 'lost') {
  <button type="button" (click)="open.emit()"
          data-testid="streak-pill"
          [attr.data-mode]="mode"
          [attr.aria-label]="mode === 'protected' ? ('daily.streakFreeze.pillProtectedLabel' | translate) : (labelKey() | translate: { streak: streak()?.streak ?? 0 })"
          class="inline-flex items-center gap-2.5 min-h-11 px-1 text-sm font-semibold tabular-nums whitespace-nowrap cursor-pointer touch-manipulation">
    <span class="flex items-center gap-1.5" style="color:var(--color-accent-3)">
      <app-streak-icon name="flame" />{{ daysKey() | translate: { n: streak()?.streak ?? 0 } }}
    </span>
    @if (mode === 'on' || mode === 'protected') {
      <span aria-hidden="true" style="color:var(--text-faint)">·</span>
      <span class="flex items-center gap-1.5" style="color:var(--color-accent-2)">
        <app-streak-icon name="snowflake" />{{ freezesKey() | translate: { n: streak()?.freezes ?? 0 } }}
      </span>
    }
  </button>
}
