<div class="fixed left-1/2 z-20 w-full px-4" style="bottom:18px;transform:translateX(-50%);max-width:402px">
  <div data-testid="gel-earned-toast" data-anim class="relative overflow-hidden flex items-center gap-3 min-h-14 px-3.5 py-3 rounded-xl"
       style="background:rgb(var(--rgb-panel) / 0.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-left:3px solid var(--color-accent-2);animation:gel-bounce .6s cubic-bezier(.2,.8,.2,1) .3s both, gel-halo .8s ease-in-out 1.3s 2">
    <span data-anim class="flex flex-shrink-0" style="animation:gel-spin 1.4s cubic-bezier(.2,.8,.2,1) .4s both">
      <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="gel-crystal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--text-hi)"></stop>
            <stop offset=".55" stop-color="rgb(var(--rgb-accent-2))"></stop>
            <stop offset="1" stop-color="rgb(var(--rgb-violet))"></stop>
          </linearGradient>
        </defs>
        <polygon points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5" fill="rgb(var(--rgb-accent-2) / .1)" stroke="url(#gel-crystal)" stroke-width="2.5" stroke-linejoin="round"></polygon>
        <g stroke="url(#gel-crystal)" stroke-width="2.5" stroke-linecap="round">
          <line x1="24" y1="12" x2="24" y2="36"></line>
          <line x1="13.6" y1="18" x2="34.4" y2="30"></line>
          <line x1="13.6" y1="30" x2="34.4" y2="18"></line>
        </g>
      </svg>
    </span>
    <div class="flex-1 min-w-0">
      <p class="m-0 text-sm font-extrabold" style="font-family:var(--font-display);color:var(--text-hi)">
        <span style="background:var(--gradient-ice);-webkit-background-clip:text;background-clip:text;color:transparent">{{ 'daily.streakFreeze.earnedToast.titleHighlight' | translate }}</span>
        {{ 'daily.streakFreeze.earnedToast.titleRest' | translate }}
      </p>
      <p class="mt-[3px] mb-0 text-xs leading-snug" style="color:var(--text-muted)">{{ 'daily.streakFreeze.earnedToast.body' | translate: { streak: streak() } }}</p>
    </div>
    <app-freeze-cells [count]="freezes()" [max]="maxFreezes()" size="sm" [fillLast]="true" />
    <button type="button" (click)="dismissed.emit()" [attr.aria-label]="'daily.streakFreeze.dismiss' | translate"
            class="flex-shrink-0 w-6 h-6 text-sm leading-none" style="color:var(--text-muted)">✕</button>
    <span data-anim class="absolute top-0 bottom-0 pointer-events-none"
          style="left:-50%;width:40%;background:linear-gradient(100deg,transparent,rgb(255 255 255 / .35),transparent);animation:gel-shine .9s ease-in-out .7s both"></span>
  </div>
</div>
