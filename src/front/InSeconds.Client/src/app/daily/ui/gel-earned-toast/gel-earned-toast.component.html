<app-toast-frame data-testid="gel-earned-toast" accent="cyan"
                 animationClass="animate-[gel-bounce_.6s_cubic-bezier(.2,.8,.2,1)_.3s_both,gel-halo_.8s_ease-in-out_1.3s_2]">
  <span data-anim class="flex flex-shrink-0 animate-[gel-spin_1.4s_cubic-bezier(.2,.8,.2,1)_.4s_both]">
    <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="gel-crystal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--text-hi)"></stop>
          <stop offset=".55" stop-color="rgb(var(--rgb-accent-2))"></stop>
          <stop offset="1" stop-color="rgb(var(--rgb-violet))"></stop>
        </linearGradient>
      </defs>
      <polygon points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5" fill="rgb(var(--rgb-accent-2) / .1)" stroke="url(#gel-crystal)" stroke-width="2.5" stroke-linejoin="round"></polygon>
      <g stroke="url(#gel-crystal)" stroke-width="2.5" stroke-linecap="round">
        <line x1="24" y1="12" x2="24" y2="36"></line>
        <line x1="13.6" y1="18" x2="34.4" y2="30"></line>
        <line x1="13.6" y1="30" x2="34.4" y2="18"></line>
      </g>
    </svg>
  </span>
  <div class="flex-1 min-w-0">
    <p class="m-0 font-display text-sm font-extrabold text-(--text-hi)">
      <span class="bg-(image:--gradient-ice) bg-clip-text text-transparent">{{ 'daily.streakFreeze.earnedToast.titleHighlight' | translate }}</span>
      {{ 'daily.streakFreeze.earnedToast.titleRest' | translate }}
    </p>
    <p class="mt-[3px] mb-0 text-xs leading-snug text-(--text-muted)">{{ 'daily.streakFreeze.earnedToast.body' | translate: { streak: streak() } }}</p>
  </div>
  <app-freeze-cells [count]="freezes()" [max]="maxFreezes()" size="sm" [fillLast]="true" />
  <button type="button" (click)="dismissed.emit()" [attr.aria-label]="'daily.streakFreeze.dismiss' | translate"
          class="flex-shrink-0 w-6 h-6 text-sm leading-none text-(--text-muted)">✕</button>
  <span data-anim class="absolute top-0 bottom-0 left-[-50%] w-[40%] pointer-events-none bg-[linear-gradient(100deg,transparent,rgb(255_255_255/.35),transparent)] animate-[gel-shine_.9s_ease-in-out_.7s_both]"></span>
</app-toast-frame>
