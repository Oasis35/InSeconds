<app-toast-frame data-testid="gel-used-toast" accent="cyan"
                 animationClass="animate-[gel-toast_.45s_cubic-bezier(.2,.8,.2,1)_.3s_both]">
  <span class="text-lg text-(--color-accent-2)"><app-streak-icon name="snowflake" /></span>
  <p class="flex-1 text-xs leading-snug text-(--text-body)">
    <strong class="font-semibold">{{ 'daily.streakFreeze.usedToast.title.' + usedKey() | translate: { n: freezesUsed() } }}</strong>
    <span class="text-(--text-muted)">{{ 'daily.streakFreeze.usedToast.body.' + usedKey() | translate: { n: freezesUsed(), streak: streak() } }}</span>
  </p>
  <button type="button" (click)="dismissed.emit()" [attr.aria-label]="'daily.streakFreeze.dismiss' | translate"
          class="flex-shrink-0 w-6 h-6 text-sm leading-none text-(--text-muted)">✕</button>
</app-toast-frame>
