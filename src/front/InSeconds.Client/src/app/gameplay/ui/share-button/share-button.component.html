<div class="flex flex-col items-center gap-1.5 w-full">
  @if (options().length === 0) {
    <button appButton type="button" [block]="true" [glow]="true" [disabled]="disabled()" (click)="share.emit()">
      {{ (copied() ? copiedKey() : labelKey()) | translate }}
    </button>
  } @else {
    <div class="relative w-full">
      <div class="split-row flex w-full">
        <button appButton type="button" class="split-main flex-1 min-w-0" [glow]="true" [disabled]="disabled()" (click)="shareMain()">
          {{ (copied() ? copiedKey() : labelKey()) | translate }}
        </button>
        <button appButton type="button" class="split-arrow" [glow]="true" [disabled]="disabled()"
          aria-haspopup="menu" [attr.aria-expanded]="menuOpen()" [attr.aria-label]="chooseKey() | translate" data-testid="share-format-toggle"
          (click)="toggleMenu()">
          <span aria-hidden="true">{{ menuOpen() ? '▴' : '▾' }}</span>
        </button>
      </div>
      @if (menuOpen()) {
        <div role="menu" class="share-menu" data-testid="share-format-menu" (keydown.arrowdown)="moveFocus($event, 1)" (keydown.arrowup)="moveFocus($event, -1)">
          @for (option of options(); track option.id) {
            <button type="button" role="menuitem" class="share-option" [attr.data-format]="option.id" (click)="choose(option)">
              <span class="share-option-label">{{ option.labelKey | translate }}</span>
              <span class="share-option-preview">{{ option.preview }}</span>
            </button>
          }
        </div>
      }
    </div>
  }
  @if (failed()) {
    <p class="text-xs" style="color:var(--text-error)">{{ failedKey() | translate }}</p>
  }
</div>
