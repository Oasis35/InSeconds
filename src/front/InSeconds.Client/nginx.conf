server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Consolidation sur le nom de domaine public : toute requête arrivant encore par
    # l'URL Northflank par défaut du front est redirigée en 301 vers inseconds.cc
    # (chemin + query préservés). Le 301 met à jour l'index des moteurs de recherche
    # et l'historique/cache d'adresse des navigateurs ; il ne réécrit PAS les favoris
    # déjà enregistrés (aucun mécanisme ne permet ça à distance).
    if ($host = "p01--front--b5cnx77tvxgb.code.run") {
        return 301 https://inseconds.cc$request_uri;
    }

    # Bundles Angular hashés (angular.json: outputHashing "all" — le contenu change le nom
    # de fichier à chaque build) : cache long et immuable, aucun risque de servir une version
    # périmée puisqu'une nouvelle version a toujours une nouvelle URL.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fichiers non hashés (traductions i18n) : toujours revalider auprès du serveur.
    # Sans ça, le navigateur peut garder en cache une ancienne version après déploiement —
    # incident du 2026-08-15 : clés i18n manquantes affichées en brut ("admin.browserId.label"
    # au lieu du texte traduit) chez un joueur ayant chargé l'app juste avant/pendant un déploiement.
    location /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html (servi aussi pour les routes SPA via try_files) : idem, jamais de cache dur —
    # référence les noms hashés des bundles courants, une vieille copie pointerait vers des
    # fichiers qui n'existent plus après un déploiement.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
