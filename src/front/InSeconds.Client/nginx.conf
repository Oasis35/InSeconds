# Séparateur de query pour la redirection legacy : "?" si l'URL d'origine n'avait
# pas de query, "&" sinon — pour pouvoir y accoler `from=legacy` proprement.
map $args $legacy_qsep {
    ""      "?";
    default "&";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Consolidation sur le nom de domaine public : toute requête arrivant encore par
    # l'URL Northflank par défaut du front est redirigée en 301 vers inseconds.cc
    # (chemin + query préservés), avec `from=legacy` ajouté pour que le front affiche
    # une pop-up « l'adresse a changé, pense à mettre à jour ton favori ».
    # Le 301 met à jour l'index des moteurs et l'historique d'adresse des navigateurs ;
    # il ne réécrit PAS les favoris déjà enregistrés (aucun mécanisme ne permet ça).
    if ($host = "p01--front--b5cnx77tvxgb.code.run") {
        return 301 https://inseconds.cc$uri$is_args$args${legacy_qsep}from=legacy;
    }

    # Bundles Angular hashés (angular.json: outputHashing "all" — le contenu change le nom
    # de fichier à chaque build) : cache long et immuable, aucun risque de servir une version
    # périmée puisqu'une nouvelle version a toujours une nouvelle URL.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Fichiers non hashés (traductions i18n) : toujours revalider auprès du serveur.
    # Sans ça, le navigateur peut garder en cache une ancienne version après déploiement —
    # incident du 2026-08-15 : clés i18n manquantes affichées en brut ("admin.browserId.label"
    # au lieu du texte traduit) chez un joueur ayant chargé l'app juste avant/pendant un déploiement.
    location /i18n/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # index.html (servi aussi pour les routes SPA via try_files) : idem, jamais de cache dur —
    # référence les noms hashés des bundles courants, une vieille copie pointerait vers des
    # fichiers qui n'existent plus après un déploiement.
    #
    # Headers de sécurité (nosniff/frame-options/referrer-policy/permissions-policy) répétés
    # dans chaque location car nginx n'hérite PAS des add_header du niveau `server` dès qu'une
    # location définit son propre add_header (ici Cache-Control) — piège nginx classique, sans
    # ça ces headers auraient disparu silencieusement sur les 3 locations de ce fichier.
    # Pas de Content-Security-Policy pour l'instant : la liste exacte des sous-domaines CDN
    # Deezer utilisés pour les previews audio/covers n'est pas figée, un CSP mal calibré
    # casserait le blind test (fonctionnalité coeur) sans qu'aucun test CI ne le détecte.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
