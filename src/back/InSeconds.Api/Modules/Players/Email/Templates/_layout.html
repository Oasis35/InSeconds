<style>
  /* Fond repris tel quel de src/styles.scss - .da-bg / .da-grid / .scanlines.
     Les clients qui suppriment <style> (Outlook) retombent sur bgcolor="#0e0a26". */
  :root{
    --rgb-bg:14 10 38;
    --rgb-accent-2:0 229 255;
    --rgb-violet:168 85 247;
  }
  .da-bg{
    background:radial-gradient(ellipse 120% 40% at 50% 0%, rgb(70 40 140 / 0.36), transparent 70%), rgb(var(--rgb-bg));
    overflow-x:clip;
  }
  .da-decor{position:relative;}
  .da-grid{
    position:absolute;
    inset:0;
    overflow:hidden;
    opacity:1;
    pointer-events:none;
  }
  .da-grid::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgb(var(--rgb-accent-2) / 0.25) 1px, transparent 1px),
      linear-gradient(90deg, rgb(var(--rgb-accent-2) / 0.25) 1px, transparent 1px);
    background-size:26px 18px;
    transform:perspective(220px) rotateX(58deg) scale(2.1);
    transform-origin:top;
  }
  .scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0.03;
    background-image:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px);
  }
  .da-content{position:relative;}
  /* Carte reprise des cartes du jeu : bleu nuit profond presque opaque, filet plat bleuté, coins de 16 px.
     Fallback bgcolor pour Outlook. */
  .card{
    background:rgb(10 12 34 / 0.9)!important;
    border:1px solid rgb(150 165 230 / 0.32)!important;
  }
  /* Le bouton principal du jeu : ambre uni, texte noir chaud, filet clair et un seul halo serré. */
  .cta{
    background:#FF9500!important;
    border:1.5px solid #FFC46B;
    box-shadow:0 0 8px rgb(255 149 0 / 0.6);
  }
  .panel{background:rgb(18 22 52 / 0.7)!important;}
  .hairline{background:rgb(150 165 230 / 0.22)!important;}
  @media only screen and (max-width:620px){
    .container{width:100%!important}
    .px{padding-left:28px!important;padding-right:28px!important}
    .h1{font-size:26px!important;line-height:32px!important}
  }
</style>
</head>
<body class="da-bg" bgcolor="#0e0a26" style="margin:0;padding:0;background-color:#0e0a26;">
