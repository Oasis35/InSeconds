# Portée de l'analyse SonarCloud.
#
# ⚠️ Ce projet est en *Automatic Analysis* et n'ingère PAS ce fichier (vérifié :
#    plusieurs pushes, aucune prise en compte). L'exclusion réelle est donc posée
#    dans l'UI SonarCloud : Administration → Analysis Scope → "Source File Exclusions"
#    = **/api.generated.ts. Ce fichier n'est conservé que comme documentation d'intention
#    et pour être honoré si le projet passe un jour à une analyse par scanner en CI.
#
# api.generated.ts est un client TypeScript 100 % généré par NSwag (voir CLAUDE.md racine).
# Chaque endpoint produit une paire de méthodes request/process au boilerplate quasi
# identique → la détection de copier-coller le compte comme "duplication sur le nouveau
# code" à chaque nouvel endpoint et fait échouer la Quality Gate (seuil 3 %). On ne
# corrige jamais ce fichier à la main (on modifie le back puis on régénère).
sonar.exclusions=**/api.generated.ts
