# Portée de l'analyse SonarCloud (Automatic Analysis — pas de job CI dédié).
#
# api.generated.ts est un client TypeScript 100 % généré par NSwag (voir CLAUDE.md racine,
# « NSwag — génération du client TypeScript »). Chaque endpoint produit une paire de méthodes
# request/process au boilerplate quasi identique : la détection de copier-coller le comptait
# comme « duplication sur le nouveau code » à chaque nouvel endpoint et faisait échouer la
# Quality Gate (seuil 3 %). On l'exclut entièrement de l'analyse — on ne corrige jamais ce
# fichier à la main (on modifie le back puis on régénère), donc bugs/smells/duplication
# rapportés dessus n'auraient de toute façon aucune action possible.
#
# NB : l'Automatic Analysis ne lit que `sonar.exclusions` / `sonar.test.exclusions` /
# `sonar.coverage.exclusions` depuis ce fichier — pas `sonar.cpd.exclusions` (ignoré).
sonar.exclusions=**/api.generated.ts
