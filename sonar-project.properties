# Configuration de portée pour SonarCloud (Automatic Analysis — pas de job CI dédié).
#
# api.generated.ts est un client TypeScript généré par NSwag (voir CLAUDE.md racine,
# « NSwag — génération du client TypeScript ») : chaque endpoint produit une paire de
# méthodes request/process au boilerplate quasi identique. La détection de copier-coller
# le compte comme de la duplication « sur le nouveau code » à chaque nouvel endpoint et
# fait échouer la Quality Gate (seuil 3 %). On exclut donc ce fichier généré de la CPD
# uniquement — le reste de l'analyse (bugs, code smells, couverture) n'est pas affecté.
sonar.cpd.exclusions=**/api.generated.ts
