# Environnement de staging (dev.inseconds.cc / api-dev.inseconds.cc), même VPS que la prod.
# Déployé par le job `deploy-staging` de .github/workflows/ci.yml sur push de la branche
# `env/staging`, depuis un checkout séparé (~/apps/InSeconds-staging) pour ne jamais toucher
# celui de la prod. Nom de projet, conteneurs et réseau interne distincts de la prod :
# les deux stacks cohabitent sans se voir, seuls shared-postgres et caddy-net sont communs.
# Variables dans .env.staging (non commité, cf. .env.staging.example).
#
# Refonte v2 (PR A6) : le staging construit la v2 (src/v2). Même base inseconds_staging : la v2
# vit dans ses propres schémas, les tables v1 restent dans public. Migrations appliquées par
# deploy/vps/deploy.sh (--migrate-only) avant de remplacer les conteneurs. Mêmes noms de
# conteneurs qu'en v1 : Caddy ne change pas.
name: inseconds-staging

services:
  api:
    build:
      context: ./src/v2/back
      dockerfile: InSeconds.Api/Dockerfile
    container_name: inseconds-staging.api
    restart: unless-stopped
    environment:
      # Jamais Development ni Testing : l'API staging est publique (Cloudflare Access ne protège que
      # le front, cf. CLAUDE.md racine). Les routes de test ne sont de toute façon pas dans l'image (S9).
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: "Host=shared-postgres;Port=5432;Database=inseconds_staging;Username=inseconds_staging;Password=${INSECONDS_STAGING_DB_PASSWORD}"
      Brevo__ApiKey: ${BREVO_API_KEY}
      # Tous les emails du staging partent vers cette seule adresse, avec un bandeau DEV
      # (RedirectingEmailSender). Obligatoire : l'API refuse de démarrer sans.
      EmailRedirect__To: ${STAGING_EMAIL_REDIRECT_TO}
      # Certificat qui chiffre les clés Data Protection (PLAN S16), chargé par l'API au démarrage.
      DataProtection__CertificatePath: /run/secrets/dataprotection.pfx
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?à renseigner dans .env.staging (mot de passe de secrets/dataprotection.pfx)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      # Hors du dépôt, à la racine du checkout (~/apps/InSeconds-staging/secrets/), lisible par
      # l'utilisateur de l'image (uid/gid 1654), cf. .env.staging.example. deploy.sh vérifie sa
      # présence et sa lecture avant de remplacer les conteneurs : selon le moteur, Docker crée un
      # dossier vide à la place d'un fichier absent, même avec create_host_path: false.
      - type: bind
        source: ./secrets/dataprotection.pfx
        target: /run/secrets/dataprotection.pfx
        read_only: true
        bind:
          create_host_path: false
    networks:
      - shared-postgres
      - internal
      - caddy-net

  front:
    build:
      context: ./src/v2/front/InSeconds.Client
      dockerfile: Dockerfile.prod
      args:
        BUILD_CONFIGURATION: staging
        # Heure du déploiement affichée en admin (piège 25) : exportée par deploy/vps/deploy.sh ; vide hors déploiement.
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: inseconds-staging.front
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal
      - caddy-net

networks:
  shared-postgres:
    external: true
  caddy-net:
    external: true
  internal:
    driver: bridge
