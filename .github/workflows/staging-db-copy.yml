name: Copy prod DB to staging

# Lancement manuel uniquement (onglet Actions → "Copy prod DB to staging" → Run workflow).
#
# Copie les données de la prod (schémas players, catalogue, daily, runs, infra) dans la base du staging, puis les
# anonymise (deploy/vps/copy-prod-db-to-staging.sh, avec deploy/vps/staging-anonymize.sql de ce commit).
# Depuis la PR I1 (#235) : plus d'import v1 → v2 ici (avant, ce workflow copiait les tables v1 de public puis
# refaisait l'import, scripts retirés en I2, cf. l'historique git).
# Un workflow manuel n'est listé que s'il existe sur main ; c'est la version de la branche choisie au lancement
# qui s'exécute. La prod n'est lue qu'en pg_dump, jamais modifiée. L'image de l'API staging doit être déployée :
# la copie l'utilise pour les migrations et la clé Data Protection neuve.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tape "staging" pour confirmer : la base du staging sera entièrement remplacée'
        required: true

permissions:
  contents: read

jobs:
  copy:
    name: Copy + anonymize
    runs-on: ubuntu-latest
    if: inputs.confirm == 'staging'
    # Même groupe que le déploiement staging : pas de copie pendant un rebuild du staging
    # (l'API est arrêtée puis relancée par les scripts).
    concurrency:
      group: deploy-vps-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host: ${{ secrets.VPS_HOST }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}

      - name: Send anonymization script
        # Celui de ce commit, pas celui du checkout du staging.
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cat > ~/inseconds-staging-anonymize.sql' < deploy/vps/staging-anonymize.sql

      - name: Copy prod DB to staging, anonymize
        # Le script part de ce checkout (bash -s) : pas besoin qu'il soit déjà présent sur le VPS.
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'STAGING_ANONYMIZE_SQL=$HOME/inseconds-staging-anonymize.sql bash -s' \
            < deploy/vps/copy-prod-db-to-staging.sh

      - name: Remove anonymization script
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'rm -f ~/inseconds-staging-anonymize.sql'
