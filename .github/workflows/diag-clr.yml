# Diagnostic temporaire du crash CLR (0x80131506) des tests unitaires : à supprimer avec sa branche.
name: Diag CLR
on:
  push:
    branches: [feat/diag-clr]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        variant: [ns-Catalogue, ns-Daily, ns-Runs, ns-Players, ns-Social, ns-Gameplay, ns-Infrastructure, ns-Deezer, ns-Waveform, par-none, cpu1]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json
      - name: Build unit tests
        working-directory: src/back
        run: dotnet build tests/InSeconds.UnitTests --configuration Release
      - name: Loop
        working-directory: src/back
        run: |
          case "${{ matrix.variant }}" in
            cpu1) export DOTNET_PROCESSOR_COUNT=1 ;;
            tc0) export DOTNET_TieredCompilation=0 ;;
            pgo0) export DOTNET_TieredPGO=0 ;;
            r2r0) export DOTNET_ReadyToRun=0 ;;
            quickjit0) export DOTNET_TC_QuickJit=0 ;;
            osr0) export DOTNET_TC_OnStackReplacement=0 ;;
            gen0) export DOTNET_GCgen0size=4000000 ;;
          esac
          lscpu | grep "Model name"
          fail=0
          for i in $(seq 1 40); do
            case "${{ matrix.variant }}" in
              ns-*) cmd="tests/InSeconds.UnitTests/bin/Release/net10.0/InSeconds.UnitTests -namespace InSeconds.UnitTests.${{ matrix.variant }}" ; cmd="${cmd/ns-/}" ;;
              par-none) cmd="tests/InSeconds.UnitTests/bin/Release/net10.0/InSeconds.UnitTests -parallel none" ;;
              *) cmd="tests/InSeconds.UnitTests/bin/Release/net10.0/InSeconds.UnitTests" ;;
            esac
            if ! $cmd > /tmp/out.txt 2>&1; then
              fail=$((fail+1)); grep -m2 -E "Fatal|CLR|failed" /tmp/out.txt | cut -c1-160
            fi
          done
          echo "ECHECS $fail / 40 (variant=${{ matrix.variant }})"
