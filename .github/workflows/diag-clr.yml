# Diagnostic temporaire du crash CLR (0x80131506) des tests unitaires : à supprimer avec sa branche.
name: Diag CLR
on:
  push:
    branches: [feat/diag-clr]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
        legacy: ['0', '1']
        rep: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json
      - name: Build unit tests
        working-directory: src/back
        run: dotnet build tests/InSeconds.UnitTests --configuration Release
      - name: Environment
        run: |
          lscpu | grep -E "Model name|Flags" | cut -c1-400
          dotnet --info | head -30
          cat /etc/os-release | head -3
      - name: Loop
        working-directory: src/back
        env:
          DOTNET_LegacyExceptionHandling: ${{ matrix.legacy }}
        run: |
          fail=0
          for i in $(seq 1 40); do
            if ! dotnet test --project tests/InSeconds.UnitTests --configuration Release --no-build > /tmp/out.txt 2>&1; then
              fail=$((fail+1)); echo "run $i failed"; grep -m3 -E "Fatal|CLR" /tmp/out.txt; lscpu | grep "Model name"
            fi
          done
          echo "ECHECS $fail / 40 (os=${{ matrix.os }} legacy=${{ matrix.legacy }})"
