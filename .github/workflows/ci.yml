name: CI

# Push seulement : une PR (vers env/staging ou main) affiche le run du push sur son commit de tête, qui suffit au
# ruleset. Un déclencheur pull_request refaisait le même run une seconde fois.
on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Une branche qui ne change que de la doc (*.md, docs/) par rapport à env/staging saute les jobs de build et de
  # tests. Toujours tout sur main et env/staging (déploiement). La comparaison porte sur toute la branche, pas sur
  # le dernier push : un run annulé (cancel-in-progress) ne laisse jamais du code non testé derrière un commit de doc.
  # Le job « CI OK » en fin de fichier agrège tous les jobs : c'est le seul check exigé par le ruleset.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Code changed since env/staging?
        id: diff
        run: |
          code=true
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_REF" != refs/heads/env/staging ] \
            && base=$(git merge-base origin/env/staging HEAD) \
            && ! git diff --name-only "$base" HEAD | grep -qvE '(\.md$|^docs/)'; then
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  front:
    name: Frontend (build, Vitest, Sheriff)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/front/InSeconds.Client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/front/InSeconds.Client/package-lock.json

      - name: Install (clean)
        run: npm ci --ignore-scripts

      - name: Architecture (Sheriff + pure domain layer)
        run: npm run lint:arch

      - name: Build (production, service worker included)
        run: npm run build

      # Navigateurs en cache (clé : version de Playwright) ; les paquets système, eux, s'installent à chaque fois.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium

      - name: Run unit tests
        run: npx --no-install ng test --watch=false

  # Image de prod du front : Cache-Control, en-têtes de sécurité, CSP, plus la PWA (ngsw.json et worker sans
  # cache, aucun dataGroups). En parallèle de front, qui vérifie déjà le build.
  nginx-headers:
    name: Frontend (nginx headers smoke test)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image and verify headers
        working-directory: src/front/InSeconds.Client
        run: bash scripts/check-nginx-headers.sh

  # E2E contre l'hôte de test de l'API (InSeconds.Api.Testing, port 5175) et le front servi par
  # ng serve (port 5176, proxy /api). Découpés en 4 jobs, les specs réparties selon leur durée
  # (scripts/e2e-shard.mjs) : chacun a sa base, son hôte de test et son ng serve, comme le job unique d'avant.
  e2e:
    name: E2E (Playwright ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inseconds
          POSTGRES_PASSWORD: inseconds_e2e
          POSTGRES_DB: inseconds_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inseconds -d inseconds_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Build test host (Debug)
        working-directory: src/back
        run: dotnet build InSeconds.Api.Testing/InSeconds.Api.Testing.csproj --configuration Debug

      # --no-launch-profile : sans lui, launchSettings.json impose l'environnement Development
      # (origines de confiance, limites de débit…), cf. piège 9.
      - name: Start test host
        working-directory: src/back/InSeconds.Api.Testing
        run: dotnet run --no-build --no-launch-profile --configuration Debug --urls http://localhost:5175 > /tmp/backend.log 2>&1 &
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=inseconds_e2e;Username=inseconds;Password=inseconds_e2e

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/front/InSeconds.Client/package-lock.json

      - name: Install npm dependencies
        working-directory: src/front/InSeconds.Client
        run: npm ci --ignore-scripts

      - name: Start Angular dev server
        working-directory: src/front/InSeconds.Client
        run: npx --no-install ng serve --configuration e2e-ci --port 5176 > /tmp/angular.log 2>&1 &

      - name: Playwright version
        id: playwright
        working-directory: src/front/InSeconds.Client
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: src/front/InSeconds.Client
        run: npx --no-install playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: src/front/InSeconds.Client
        run: npx --no-install playwright install-deps chromium

      # --retry-connrefused : sans réponse au bout du délai, l'étape échoue (une boucle `curl && break` laisse passer).
      - name: Wait for backend
        run: curl -sf --retry 60 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:5175/health

      - name: Wait for frontend
        run: curl -sf -o /dev/null --retry 120 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:5176

      - name: Run E2E tests
        working-directory: src/front/InSeconds.Client
        run: npx --no-install playwright test $(node scripts/e2e-shard.mjs ${{ matrix.shard }} 4)
        env:
          CI: 'true'

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          echo "=== Backend logs ==="
          cat /tmp/backend.log || true
          echo "=== Angular logs ==="
          cat /tmp/angular.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: src/front/InSeconds.Client/playwright-report/
          retention-days: 7

  back:
    name: Backend (build, tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/back
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Restore
        run: dotnet restore InSeconds.slnx

      - name: Build (Release)
        run: dotnet build InSeconds.slnx --configuration Release --no-restore

      # Unitaires, architecture, intégration et scripts SQL du VPS (Testcontainers : Docker est fourni par ubuntu-latest).
      # Délai : la suite prend quelques minutes ; un test bloqué ne retient plus le job jusqu'à la limite de 6 h.
      - name: Test
        timeout-minutes: 20
        run: dotnet test --solution InSeconds.slnx --configuration Release --no-build

  # Les vérifications du back qui ne sont pas des tests, en parallèle du job back : migrations, code Wolverine, image de prod.
  back-checks:
    name: Backend (migrations, Wolverine code, prod image)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/back
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Restore
        run: dotnet restore InSeconds.slnx

      - name: Build (Release)
        run: dotnet build InSeconds.Api/InSeconds.Api.csproj --configuration Release --no-restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Verify EF model has no pending migrations
        working-directory: src/back/InSeconds.Api
        run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release

      # En staging et en prod, Wolverine charge le code commité dans Internal/Generated au lieu de
      # le compiler au démarrage : il doit correspondre aux handlers et endpoints actuels.
      - name: Verify Wolverine generated code is up to date
        run: |
          rm -rf InSeconds.Api/Internal/Generated
          dotnet run --project InSeconds.Api --configuration Release --no-build --no-launch-profile -- codegen write
          if [ -n "$(git status --porcelain --untracked-files=all -- InSeconds.Api/Internal/Generated)" ]; then
            git status --short -- InSeconds.Api/Internal/Generated
            echo "::error::Code Wolverine généré pas à jour : lancer « dotnet run --project InSeconds.Api -- codegen write » (après avoir vidé InSeconds.Api/Internal/Generated) et commiter."
            exit 1
          fi

      # S9 : l'hôte de test (routes /api/e2e, faux email) ne doit jamais atteindre l'image de prod.
      - name: Build prod image and check it has no test host
        run: |
          docker build -f InSeconds.Api/Dockerfile -t inseconds-api:ci .
          files=$(docker run --rm --entrypoint ls inseconds-api:ci /app)
          echo "$files" | grep -q '^InSeconds.Api.dll$' || { echo "::error::InSeconds.Api.dll absent de l'image"; exit 1; }
          if echo "$files" | grep -q 'InSeconds.Api.Testing'; then
            echo "::error::InSeconds.Api.Testing présent dans l'image de prod (S9)."
            exit 1
          fi

  # Seul check exigé par le ruleset « Branches protégées » : échoue si un job a échoué ou a été
  # annulé (un job sauté, sur une branche qui ne change que de la doc, compte comme réussi).
  # Tout nouveau job doit être ajouté à `needs`, sinon il ne bloque pas le merge.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    needs:
      - changes
      - front
      - nginx-headers
      - back
      - back-checks
      - e2e
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Jobs en échec ou annulés : $(echo $failed)"
            exit 1
          fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Attend « CI OK », comme deploy-staging (même raison pour always(), cf. plus bas, G6a, #312).
    needs: [ci-ok]
    if: ${{ always() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    # M17 (revue du 25/09) : groupe de concurrency dédié, distinct de celui du workflow
    # (${{ github.workflow }}-${{ github.ref }}, cf. en-tête du fichier). Sans ça, un déploiement
    # en cours pouvait être annulé en plein milieu (cancel-in-progress du groupe workflow) par un
    # nouveau push sur main — laissant le VPS avec un `docker compose up --build` interrompu
    # (conteneur à moitié reconstruit). `cancel-in-progress: false` fait attendre un déploiement
    # suivant plutôt que de couper celui en cours ; groupe fixe (pas par ref) car ce job ne
    # tourne de toute façon que sur main.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Checkout (action locale vps-ssh)
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host: ${{ secrets.VPS_HOST }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}

      - name: Deploy (checkout commit tested by this run + rebuild + vérification santé)
        run: |
          echo "Deploying commit ${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd ~/apps/InSeconds
            git fetch origin
            git checkout main
            git reset --hard ${{ github.sha }}
            chmod +x deploy/vps/deploy.sh
            ./deploy/vps/deploy.sh
          '

  deploy-staging:
    name: Deploy to staging (dev.inseconds.cc)
    runs-on: ubuntu-latest
    # Attend « CI OK ». `always()` est indispensable : sans lui, le `if` porte un `success()` implicite
    # qui remonte toute la chaîne des `needs`, « CI OK » compris, et un seul job sauté en amont faisait
    # sauter le déploiement alors que « CI OK » était vert (B2, B3, #262 n'ont pas été déployés quand
    # le filtre de chemins de la v1 sautait des jobs). Le résultat de « CI OK » est donc testé explicitement.
    needs: [ci-ok]
    # Branche de déploiement du staging, protégée : on y arrive par PR. Cf. docs/exploitation/deploiement.md § Staging.
    if: ${{ always() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/env/staging' && github.event_name == 'push' }}
    # Groupe distinct de deploy-vps (prod) : GitHub ne garde qu'un seul job en attente par
    # groupe et annule le précédent — un groupe commun pourrait faire sauter un déploiement
    # prod en attente au profit d'un déploiement staging poussé juste après.
    concurrency:
      group: deploy-vps-staging
      cancel-in-progress: false
    steps:
      - name: Checkout (action locale vps-ssh)
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host: ${{ secrets.VPS_HOST }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}

      - name: Deploy staging (checkout commit tested by this run + rebuild + vérification santé)
        run: |
          echo "Deploying commit ${{ github.sha }} to staging"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd ~/apps/InSeconds-staging
            git fetch origin
            git checkout --force --detach ${{ github.sha }}
            chmod +x deploy/vps/deploy.sh
            ./deploy/vps/deploy.sh staging
          '
