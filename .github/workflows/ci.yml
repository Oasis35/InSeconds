name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Refonte v2 (PR A5) : les jobs v2 ne tournent que si leur code a changé, pour qu'un run sans
  # changement v2 (correctif v1, Dependabot v1) prenne le même temps qu'avant. Les jobs v1 tournent
  # toujours. Le job « CI OK » en fin de fichier agrège tout : c'est le seul check à exiger dans le
  # ruleset (un job sauté y compte comme réussi).
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # pull_request : liste des fichiers modifiés lue par l'API
    outputs:
      v2-back: ${{ steps.filter.outputs.v2-back }}
      v2-front: ${{ steps.filter.outputs.v2-front }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Base de comparaison :
      # - push sur une branche de travail : env/staging (merge-base), donc TOUS les changements de
      #   la branche. Comparer au commit d'avant le push perdait les changements d'un run annulé
      #   par un push suivant (cancel-in-progress) : un job v2 pouvait ne jamais tourner sur la PR.
      #   Une branche v1 (partie de main) n'a aucun fichier v2 depuis la merge-base : rien ne tourne.
      # - push sur main ou env/staging : base = la branche → commit d'avant le push (le merge de la
      #   PR), chaque PR ayant déjà été testée en entier sur sa branche.
      # - pull_request : base ignorée, comparaison avec la branche cible de la PR.
      - name: Filter
        id: filter
        # Action tierce : épinglée sur le SHA du commit (Sonar S7637), Dependabot le met à jour.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/env/staging') && github.ref || 'env/staging' }}
          filters: |
            v2-back:
              - 'src/v2/back/**'
              - '.github/workflows/ci.yml'
            v2-front:
              - 'src/v2/front/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'src/front/InSeconds.Client/e2e/**'
              - 'src/front/InSeconds.Client/playwright.config.ts'
              - 'src/v2/front/InSeconds.Client/e2e/**'
              - 'src/v2/front/InSeconds.Client/playwright.config.ts'
              - 'scripts/check-e2e-parity.mjs'
              - '.github/workflows/ci.yml'

  back:
    name: Backend (build + EF migrations check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Restore
        working-directory: src/back
        run: dotnet restore InSeconds.slnx

      - name: Build (Release)
        working-directory: src/back
        run: dotnet build InSeconds.slnx --configuration Release --no-restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Verify EF model has no pending migrations
        working-directory: src/back/InSeconds.Api
        run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release

  unit-tests:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Restore
        working-directory: src/back
        run: dotnet restore InSeconds.slnx

      - name: Test
        working-directory: src/back
        run: dotnet test InSeconds.Api.UnitTests --no-restore --logger "console;verbosity=normal"

  front:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/front/InSeconds.Client/package-lock.json

      - name: Install (clean)
        working-directory: src/front/InSeconds.Client
        run: npm ci --ignore-scripts

      - name: Build (production)
        working-directory: src/front/InSeconds.Client
        run: npm run build

  unit-tests-front:
    name: Frontend (unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/front/InSeconds.Client/package-lock.json

      - name: Install (clean)
        working-directory: src/front/InSeconds.Client
        run: npm ci --ignore-scripts

      - name: Generate build-info
        working-directory: src/front/InSeconds.Client
        run: node scripts/generate-build-info.mjs

      - name: Install Playwright browsers
        working-directory: src/front/InSeconds.Client
        run: npx --no-install playwright install --with-deps chromium

      - name: Run unit tests
        working-directory: src/front/InSeconds.Client
        run: npx --no-install ng test --watch=false

  front-v2:
    name: Frontend v2 (build, Vitest, Sheriff)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.v2-front == 'true'
    defaults:
      run:
        working-directory: src/v2/front/InSeconds.Client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/v2/front/InSeconds.Client/package-lock.json

      - name: Install (clean)
        run: npm ci --ignore-scripts

      - name: Architecture (Sheriff + pure domain layer)
        run: npm run lint:arch

      - name: Build (production, service worker included)
        run: npm run build

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium

      - name: Run unit tests
        run: npx --no-install ng test --watch=false

  nginx-headers:
    name: Frontend (nginx cache headers smoke test)
    runs-on: ubuntu-latest
    needs: [front]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image and verify Cache-Control headers
        working-directory: src/front/InSeconds.Client
        run: bash scripts/check-nginx-cache-headers.sh

  # Image de prod du front v2 : mêmes vérifications qu'en v1, plus la PWA (ngsw.json et worker sans
  # cache, aucun dataGroups). En parallèle de front-v2, qui vérifie déjà le build.
  nginx-headers-v2:
    name: Frontend v2 (nginx headers smoke test)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.v2-front == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image and verify headers
        working-directory: src/v2/front/InSeconds.Client
        run: bash scripts/check-nginx-headers.sh

  # E8 : les E2E copiés en v2 ne divergent pas de ceux de la v1 (listes `playwright test --list`).
  e2e-parity:
    name: E2E v1/v2 parity
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            src/front/InSeconds.Client/package-lock.json
            src/v2/front/InSeconds.Client/package-lock.json

      - name: Install v1 (clean)
        working-directory: src/front/InSeconds.Client
        run: npm ci --ignore-scripts

      - name: Install v2 (clean)
        working-directory: src/v2/front/InSeconds.Client
        run: npm ci --ignore-scripts

      - name: Compare E2E lists
        run: node scripts/check-e2e-parity.mjs

  integration-tests:
    name: Backend (integration tests)
    runs-on: ubuntu-latest
    needs: [back]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Restore
        working-directory: src/back
        run: dotnet restore InSeconds.slnx

      - name: Build (Debug)
        working-directory: src/back
        run: dotnet build InSeconds.slnx --configuration Debug --no-restore

      - name: Run integration tests
        working-directory: src/back
        run: dotnet test InSeconds.Api.IntegrationTests --no-build --configuration Debug --logger "console;verbosity=normal"

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [back, unit-tests, unit-tests-front, front]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inseconds
          POSTGRES_PASSWORD: inseconds_e2e
          POSTGRES_DB: inseconds_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inseconds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Restore .NET
        working-directory: src/back
        run: dotnet restore InSeconds.slnx

      - name: Build .NET (Debug)
        working-directory: src/back
        run: dotnet build InSeconds.slnx --configuration Debug --no-restore

      - name: Start backend
        working-directory: src/back/InSeconds.Api
        run: dotnet run --no-build --no-launch-profile --configuration Debug --urls http://localhost:5171 > /tmp/backend.log 2>&1 &
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=inseconds_e2e;Username=inseconds;Password=inseconds_e2e
          E2E_FRONT_PORT: '5173'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/front/InSeconds.Client/package-lock.json

      - name: Install npm dependencies
        working-directory: src/front/InSeconds.Client
        run: npm ci --ignore-scripts

      - name: Generate build-info
        working-directory: src/front/InSeconds.Client
        run: node scripts/generate-build-info.mjs

      - name: Start Angular dev server
        working-directory: src/front/InSeconds.Client
        run: npx --no-install ng serve --configuration e2e-ci --port 5173 > /tmp/angular.log 2>&1 &

      - name: Install Playwright browsers
        working-directory: src/front/InSeconds.Client
        run: npx --no-install playwright install --with-deps chromium

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5171/api/settings && break
            echo "Waiting for backend ($i/60)..."
            sleep 3
          done

      - name: Wait for frontend
        run: |
          for i in $(seq 1 120); do
            curl -sf http://localhost:5173 && break
            echo "Waiting for frontend ($i/120)..."
            sleep 3
          done

      - name: Run E2E tests
        working-directory: src/front/InSeconds.Client
        run: npx --no-install playwright test
        env:
          CI: 'true'

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          echo "=== Backend logs ==="
          cat /tmp/backend.log || true
          echo "=== Angular logs ==="
          cat /tmp/angular.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/front/InSeconds.Client/playwright-report/
          retention-days: 7

  back-v2:
    name: Backend v2 (build, migrations, tests, image)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.v2-back == 'true'
    defaults:
      run:
        working-directory: src/v2/back
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/v2/back/global.json

      - name: Restore
        run: dotnet restore InSeconds.slnx

      - name: Build (Release)
        run: dotnet build InSeconds.slnx --configuration Release --no-restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Verify EF model has no pending migrations
        working-directory: src/v2/back/InSeconds.Api
        run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release

      # En staging et en prod, Wolverine charge le code commité dans Internal/Generated au lieu de
      # le compiler au démarrage : il doit correspondre aux handlers et endpoints actuels.
      - name: Verify Wolverine generated code is up to date
        run: |
          rm -rf InSeconds.Api/Internal/Generated
          dotnet run --project InSeconds.Api --configuration Release --no-build --no-launch-profile -- codegen write
          if [ -n "$(git status --porcelain --untracked-files=all -- InSeconds.Api/Internal/Generated)" ]; then
            git status --short -- InSeconds.Api/Internal/Generated
            echo "::error::Code Wolverine généré pas à jour : lancer « dotnet run --project InSeconds.Api -- codegen write » (après avoir vidé InSeconds.Api/Internal/Generated) et commiter."
            exit 1
          fi

      # Unitaires, architecture et intégration (Testcontainers : Docker est fourni par ubuntu-latest).
      - name: Test
        run: dotnet test --solution InSeconds.slnx --configuration Release --no-build

      # S9 : l'hôte de test (routes /api/e2e, faux email) ne doit jamais atteindre l'image de prod.
      - name: Build prod image and check it has no test host
        run: |
          docker build -f InSeconds.Api/Dockerfile -t inseconds-api-v2:ci .
          files=$(docker run --rm --entrypoint ls inseconds-api-v2:ci /app)
          echo "$files" | grep -q '^InSeconds.Api.dll$' || { echo "::error::InSeconds.Api.dll absent de l'image"; exit 1; }
          if echo "$files" | grep -q 'InSeconds.Api.Testing'; then
            echo "::error::InSeconds.Api.Testing présent dans l'image de prod (S9)."
            exit 1
          fi

  # Seul check exigé par le ruleset « Branches protégées » : échoue si un job a échoué ou a été
  # annulé ; un job sauté par le filtre de chemins compte comme réussi. Tout nouveau job doit être
  # ajouté à `needs`, sinon il ne bloque pas le merge.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - back
      - unit-tests
      - front
      - unit-tests-front
      - nginx-headers
      - integration-tests
      - e2e
      - front-v2
      - nginx-headers-v2
      - back-v2
      - e2e-parity
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Jobs en échec ou annulés : $(echo $failed)"
            exit 1
          fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ci-ok]
    # always() : sans lui, un job v2 sauté par le filtre de chemins sauterait aussi le déploiement
    # (le statut « sauté » se propage à toute la chaîne de needs, malgré le if: always() de ci-ok).
    if: always() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    # M17 (revue du 25/09) : groupe de concurrency dédié, distinct de celui du workflow
    # (${{ github.workflow }}-${{ github.ref }}, cf. en-tête du fichier). Sans ça, un déploiement
    # en cours pouvait être annulé en plein milieu (cancel-in-progress du groupe workflow) par un
    # nouveau push sur main — laissant le VPS avec un `docker compose up --build` interrompu
    # (conteneur à moitié reconstruit). `cancel-in-progress: false` fait attendre un déploiement
    # suivant plutôt que de couper celui en cours ; groupe fixe (pas par ref) car ce job ne
    # tourne de toute façon que sur main.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Checkout (action locale vps-ssh)
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host: ${{ secrets.VPS_HOST }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}

      - name: Deploy (checkout commit tested by this run + rebuild + vérification santé)
        run: |
          echo "Deploying commit ${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd ~/apps/InSeconds
            git fetch origin
            git checkout main
            git reset --hard ${{ github.sha }}
            chmod +x deploy/vps/deploy.sh
            ./deploy/vps/deploy.sh
          '

  deploy-staging:
    name: Deploy to staging (dev.inseconds.cc)
    runs-on: ubuntu-latest
    needs: [ci-ok]
    # Branche de déploiement du staging (protégée, on y arrive par PR ; sert à la v2 pendant la
    # refonte). Cf. CLAUDE.md racine § Staging.
    # always() : cf. job deploy.
    if: always() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/env/staging' && github.event_name == 'push'
    # Groupe distinct de deploy-vps (prod) : GitHub ne garde qu'un seul job en attente par
    # groupe et annule le précédent — un groupe commun pourrait faire sauter un déploiement
    # prod en attente au profit d'un déploiement staging poussé juste après.
    concurrency:
      group: deploy-vps-staging
      cancel-in-progress: false
    steps:
      - name: Checkout (action locale vps-ssh)
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host: ${{ secrets.VPS_HOST }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}

      - name: Deploy staging (checkout commit tested by this run + rebuild + vérification santé)
        run: |
          echo "Deploying commit ${{ github.sha }} to staging"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd ~/apps/InSeconds-staging
            git fetch origin
            git checkout --force --detach ${{ github.sha }}
            chmod +x deploy/vps/deploy.sh
            ./deploy/vps/deploy.sh staging
          '
