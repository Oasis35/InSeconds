name: CI

# Push seulement : une PR (vers env/staging ou main) affiche le run du push sur son commit de tête, qui suffit au
# ruleset. Un déclencheur pull_request refaisait le même run une seconde fois.
on:
  push:
    branches: ['**']

permissions:
  contents: read

# `actions/checkout` fait un `git init` : sans branche par défaut configurée, git écrit dans chaque job un long indice
# sur le nom « master ». Donné ici à tous les git du run (variables GIT_CONFIG_*), sans toucher à l'action.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Une branche qui ne change que de la doc (*.md, docs/) par rapport à env/staging saute les jobs de build et de
  # tests. Toujours tout sur main et env/staging (déploiement). La comparaison porte sur toute la branche, pas sur
  # le dernier push : un run annulé (cancel-in-progress) ne laisse jamais du code non testé derrière un commit de doc.
  # Le job « CI OK » en fin de fichier agrège tous les jobs : c'est le seul check exigé par le ruleset.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Code changed since env/staging?
        id: diff
        run: |
          code=true
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_REF" != refs/heads/env/staging ] \
            && base=$(git merge-base origin/env/staging HEAD) \
            && ! git diff --name-only "$base" HEAD | grep -qvE '(\.md$|^docs/)'; then
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

      # Version exacte de Playwright du lockfile : elle choisit l'image des jobs front et e2e, dont les navigateurs
      # doivent être ceux du paquet npm (un bump de Dependabot change l'image du même coup).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./src/front/InSeconds.Client/package-lock.json').packages['node_modules/playwright'].version")" | tee -a "$GITHUB_OUTPUT"

  front:
    name: Frontend (build, Vitest, Sheriff)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    # Image officielle de Playwright (MCR, pas Docker Hub) : Chromium, ses bibliothèques et les polices déjà installés,
    # plus aucun apt ni téléchargement de navigateur (cf. job e2e).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
    defaults:
      run:
        working-directory: src/front/InSeconds.Client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Sans ça, setup-node prend le Node 24 préinstallé du runner, qui peut avoir un correctif de sécurité de retard.
          check-latest: true
          cache: 'npm'
          cache-dependency-path: src/front/InSeconds.Client/package-lock.json

      - name: Install (clean)
        run: npm ci --ignore-scripts

      - name: Architecture (Sheriff + pure domain layer)
        run: npm run lint:arch

      - name: Build (production, service worker included)
        run: npm run build

      - name: Run unit tests
        run: npx --no-install ng test --watch=false

  # Image de prod du front : Cache-Control, en-têtes de sécurité, CSP, plus la PWA (ngsw.json et worker sans
  # cache, aucun dataGroups). En parallèle de front, qui vérifie déjà le build.
  nginx-headers:
    name: Frontend (nginx headers smoke test)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image and verify headers
        working-directory: src/front/InSeconds.Client
        run: bash scripts/check-nginx-headers.sh

  # E2E contre l'hôte de test de l'API (InSeconds.Api.Testing, port 5175) et le front servi par
  # ng serve (port 5176, proxy /api). Découpés en 6 jobs, les specs réparties selon leur durée mesurée
  # (scripts/e2e-shard.mjs, poids dans scripts/e2e-weights.json) : chacun a sa base, son hôte de test et son ng serve.
  e2e:
    name: E2E (Playwright ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    # Image officielle de Playwright (MCR), à la version du lockfile : Chromium, ses bibliothèques système et les
    # polices y sont déjà. Remplace le cache des navigateurs et `playwright install-deps`, qui passait par le miroir apt
    # d'Azure et y restait parfois bloqué plusieurs minutes. L'image a Node 24, git, curl et les bibliothèques de .NET
    # (libicu) ; setup-dotnet y installe le SDK. On y tourne en root : Playwright lance Chromium sans bac à sable.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble

    # Depuis un job en conteneur, le service se joint par son nom (postgres:5432), pas par localhost.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inseconds
          POSTGRES_PASSWORD: inseconds_e2e
          POSTGRES_DB: inseconds_e2e
        options: >-
          --health-cmd "pg_isready -U inseconds -d inseconds_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Sans ça, setup-node prend le Node 24 préinstallé du runner, qui peut avoir un correctif de sécurité de retard.
          check-latest: true
          cache: 'npm'
          cache-dependency-path: src/front/InSeconds.Client/package-lock.json

      # En même temps : le build de l'hôte de test (processeur) et `npm ci` (réseau, disque) ne se gênent guère, et
      # chacun prenait environ 20 s l'un après l'autre. Le journal du build n'est affiché que s'il échoue.
      - name: Build test host (Debug) and install npm dependencies
        timeout-minutes: 10
        run: |
          (cd src/back && dotnet build InSeconds.Api.Testing/InSeconds.Api.Testing.csproj --configuration Debug) > /tmp/build.log 2>&1 &
          build=$!
          (cd src/front/InSeconds.Client && npm ci --ignore-scripts)
          if ! wait "$build"; then
            cat /tmp/build.log
            echo "::error::Build de l'hôte de test en échec."
            exit 1
          fi

      # --no-launch-profile : sans lui, launchSettings.json impose l'environnement Development
      # (origines de confiance, limites de débit…), cf. piège 9.
      - name: Start test host
        working-directory: src/back/InSeconds.Api.Testing
        run: dotnet run --no-build --no-launch-profile --configuration Debug --urls http://localhost:5175 > /tmp/backend.log 2>&1 &
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: >-
            Host=postgres;Port=5432;Database=inseconds_e2e;Username=inseconds;Password=inseconds_e2e

      - name: Start Angular dev server
        working-directory: src/front/InSeconds.Client
        run: npx --no-install ng serve --configuration e2e-ci --port 5176 > /tmp/angular.log 2>&1 &

      # --retry-connrefused : sans réponse au bout du délai, l'étape échoue (une boucle `curl && break` laisse passer).
      - name: Wait for backend
        run: curl -sf --retry 60 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:5175/health

      - name: Wait for frontend
        run: curl -sf -o /dev/null --retry 120 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:5176

      - name: Run E2E tests
        working-directory: src/front/InSeconds.Client
        # Une affectation arrête le script si e2e-shard.mjs échoue ; une liste vide ferait jouer toutes les specs ici.
        run: |
          files=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 6)
          [ -n "$files" ] || { echo "::error::Aucune spec pour ce job (scripts/e2e-shard.mjs)."; exit 1; }
          npx --no-install playwright test $files
        env:
          CI: 'true'

      - name: Diagnostics (on failure)
        if: failure() || cancelled()
        run: |
          echo "=== Test host build logs ==="
          cat /tmp/build.log || true
          echo "=== Backend logs ==="
          cat /tmp/backend.log || true
          echo "=== Angular logs ==="
          cat /tmp/angular.log || true

      # Le rapport HTML, et le rapport JSON qui donne la durée de chaque test (scripts/e2e-weights.mjs).
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            src/front/InSeconds.Client/playwright-report/
            src/front/InSeconds.Client/playwright-results/
          retention-days: 7

  # Les tests d'intégration (Testcontainers : Docker est fourni par ubuntu-latest), en 3 jobs répartis par dossier de
  # tests/InSeconds.IntegrationTests. Les groupes 1 et 2 prennent les dossiers de GROUP_1 et GROUP_2, le groupe 3 tout le
  # reste : un nouveau dossier y tombe seul, aucun test n'est oublié ni joué deux fois. Répartition faite sur les durées
  # que chaque job écrit dans le résumé du run (src/back/scripts/integration-durations.mjs) ; un filtre qui ne trouve
  # aucun test fait échouer le job (code 8 de Microsoft.Testing.Platform).
  back:
    name: Backend (integration ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    env:
      GROUP_1: Daily Social
      GROUP_2: Catalogue Runs
    defaults:
      run:
        working-directory: src/back
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Build (Release)
        run: dotnet build tests/InSeconds.IntegrationTests/InSeconds.IntegrationTests.csproj --configuration Release

      # Délai : un test bloqué ne retient pas le job jusqu'à sa limite.
      - name: Integration tests
        timeout-minutes: 15
        run: |
          ns() { for name in "$@"; do printf ' InSeconds.IntegrationTests.%s' "$name"; done; }
          case ${{ matrix.group }} in
            1) filter="--filter-namespace$(ns $GROUP_1)" ;;
            2) filter="--filter-namespace$(ns $GROUP_2)" ;;
            3) filter="--filter-not-namespace$(ns $GROUP_1 $GROUP_2)" ;;
          esac
          dotnet test --project tests/InSeconds.IntegrationTests/InSeconds.IntegrationTests.csproj --configuration Release \
            --no-build $filter --results-directory "$RUNNER_TEMP/back-integration" \
            --report-xunit-xml --report-xunit-xml-filename integration-${{ matrix.group }}.xml

      - name: Durations by folder
        if: success() || failure()
        run: |
          [ -d "$RUNNER_TEMP/back-integration" ] || exit 0
          { echo "### Intégration ${{ matrix.group }}/3"; node scripts/integration-durations.mjs "$RUNNER_TEMP/back-integration"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: back-integration-${{ matrix.group }}
          path: ${{ runner.temp }}/back-integration/
          if-no-files-found: ignore
          retention-days: 14

  # Les vérifications du back qui ne sont pas des tests d'intégration, en parallèle des jobs back : tests unitaires,
  # d'architecture et des scripts du VPS (tous les projets de tests/ sauf l'intégration : un nouveau projet y est joué
  # seul), migrations, code Wolverine, image de prod.
  back-checks:
    name: Backend (unit tests, migrations, Wolverine code, prod image)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/back
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/back/global.json

      - name: Restore
        run: dotnet restore InSeconds.slnx

      - name: Build (Release)
        run: dotnet build InSeconds.slnx --configuration Release --no-restore

      # Unitaires, architecture et scripts SQL et de sauvegarde du VPS (InSeconds.MigrationTests : Testcontainers).
      - name: Unit, architecture and VPS script tests
        timeout-minutes: 10
        run: |
          for project in tests/*/*.csproj; do
            case "$project" in */InSeconds.IntegrationTests/*) continue ;; esac
            dotnet test --project "$project" --configuration Release --no-build
          done

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Verify EF model has no pending migrations
        working-directory: src/back/InSeconds.Api
        run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release

      # En staging et en prod, Wolverine charge le code commité dans Internal/Generated au lieu de
      # le compiler au démarrage : il doit correspondre aux handlers et endpoints actuels.
      - name: Verify Wolverine generated code is up to date
        run: |
          rm -rf InSeconds.Api/Internal/Generated
          dotnet run --project InSeconds.Api --configuration Release --no-build --no-launch-profile -- codegen write
          if [ -n "$(git status --porcelain --untracked-files=all -- InSeconds.Api/Internal/Generated)" ]; then
            git status --short -- InSeconds.Api/Internal/Generated
            echo "::error::Code Wolverine généré pas à jour : lancer « dotnet run --project InSeconds.Api -- codegen write » (après avoir vidé InSeconds.Api/Internal/Generated) et commiter."
            exit 1
          fi

      # S9 : l'hôte de test (routes /api/e2e, faux email) ne doit jamais atteindre l'image de prod.
      - name: Build prod image and check it has no test host
        run: |
          docker build -f InSeconds.Api/Dockerfile -t inseconds-api:ci .
          files=$(docker run --rm --entrypoint ls inseconds-api:ci /app)
          echo "$files" | grep -q '^InSeconds.Api.dll$' || { echo "::error::InSeconds.Api.dll absent de l'image"; exit 1; }
          if echo "$files" | grep -q 'InSeconds.Api.Testing'; then
            echo "::error::InSeconds.Api.Testing présent dans l'image de prod (S9)."
            exit 1
          fi

  # Seul check exigé par le ruleset « Branches protégées » : échoue si un job a échoué ou a été
  # annulé (un job sauté, sur une branche qui ne change que de la doc, compte comme réussi).
  # Tout nouveau job doit être ajouté à `needs`, sinon il ne bloque pas le merge.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    needs:
      - changes
      - front
      - nginx-headers
      - back
      - back-checks
      - e2e
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Jobs en échec ou annulés : $(echo $failed)"
            exit 1
          fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Attend « CI OK », comme deploy-staging (même raison pour always(), cf. plus bas, G6a, #312).
    needs: [ci-ok]
    if: ${{ always() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    # M17 (revue du 25/09) : groupe de concurrency dédié, distinct de celui du workflow
    # (${{ github.workflow }}-${{ github.ref }}, cf. en-tête du fichier). Sans ça, un déploiement
    # en cours pouvait être annulé en plein milieu (cancel-in-progress du groupe workflow) par un
    # nouveau push sur main - laissant le VPS avec un `docker compose up --build` interrompu
    # (conteneur à moitié reconstruit). `cancel-in-progress: false` fait attendre un déploiement
    # suivant plutôt que de couper celui en cours ; groupe fixe (pas par ref) car ce job ne
    # tourne de toute façon que sur main.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Checkout (action locale vps-ssh)
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host: ${{ secrets.VPS_HOST }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}

      - name: Deploy (checkout commit tested by this run + rebuild + vérification santé)
        run: |
          echo "Deploying commit ${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd ~/apps/InSeconds
            git fetch origin
            git checkout main
            git reset --hard ${{ github.sha }}
            chmod +x deploy/vps/deploy.sh
            ./deploy/vps/deploy.sh
          '

  deploy-staging:
    name: Deploy to staging (dev.inseconds.cc)
    runs-on: ubuntu-latest
    # Attend « CI OK ». `always()` est indispensable : sans lui, le `if` porte un `success()` implicite
    # qui remonte toute la chaîne des `needs`, « CI OK » compris, et un seul job sauté en amont faisait
    # sauter le déploiement alors que « CI OK » était vert (#262 et d'autres n'ont pas été déployés
    # quand un filtre de chemins sautait des jobs). Le résultat de « CI OK » est donc testé explicitement.
    needs: [ci-ok]
    # Branche de déploiement du staging, protégée : on y arrive par PR. Cf. docs/exploitation/deploiement.md § Staging.
    if: ${{ always() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/env/staging' && github.event_name == 'push' }}
    # Groupe distinct de deploy-vps (prod) : GitHub ne garde qu'un seul job en attente par
    # groupe et annule le précédent - un groupe commun pourrait faire sauter un déploiement
    # prod en attente au profit d'un déploiement staging poussé juste après.
    concurrency:
      group: deploy-vps-staging
      cancel-in-progress: false
    steps:
      - name: Checkout (action locale vps-ssh)
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host: ${{ secrets.VPS_HOST }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}

      - name: Deploy staging (checkout commit tested by this run + rebuild + vérification santé)
        run: |
          echo "Deploying commit ${{ github.sha }} to staging"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd ~/apps/InSeconds-staging
            git fetch origin
            git checkout --force --detach ${{ github.sha }}
            chmod +x deploy/vps/deploy.sh
            ./deploy/vps/deploy.sh staging
          '
