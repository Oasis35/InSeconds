version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/back"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Les majeures ne sont jamais groupées : chacune part dans sa propre PR,
    # à review individuellement (changement de comportement potentiel).

  - package-ecosystem: "npm"
    directory: "/src/front/InSeconds.Client"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      angular:
        # Les paquets @angular/* doivent toujours bouger ensemble (peer deps
        # strictement alignées, cf. piège 15 du CLAUDE.md racine) — groupe dédié
        # pour qu'un bump partiel ne casse jamais `npm ci`.
        patterns:
          - "@angular/*"
        update-types:
          - "minor"
          - "patch"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
        update-types:
          - "minor"
          - "patch"
    # Les majeures (npm et @angular/*) ne sont jamais groupées : chacune part
    # dans sa propre PR. Une majeure peut dépasser ce que le reste de la
    # toolchain supporte (ex: typescript 7 / jasmine-core 7, cf. #119) —
    # mieux vaut le découvrir sur une PR isolée que noyé dans un gros bump.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Refonte v2 (src/v2, PR A5) : le code v2 n'existe que sur env/staging, d'où le target-branch.
  # Mêmes règles que la v1 : minor + patch groupés, majeures une par une. Versions épinglées
  # exactes dans package.json et Directory.Packages.props : Dependabot les met à jour telles quelles.
  - package-ecosystem: "nuget"
    directory: "/src/v2/back"
    target-branch: "env/staging"
    labels: ["dependencies", "refonte-v2"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      nuget-v2-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/src/v2/front/InSeconds.Client"
    target-branch: "env/staging"
    labels: ["dependencies", "refonte-v2"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      angular-v2:
        # @angular/* (dont le CDK et le service worker) toujours ensemble, cf. piège 15.
        patterns:
          - "@angular/*"
        update-types:
          - "minor"
          - "patch"
      npm-v2-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
        update-types:
          - "minor"
          - "patch"
