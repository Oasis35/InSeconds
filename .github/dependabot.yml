version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Refonte v2 (src/v2, PR A5) : les PR de la v2 visent env/staging, d'où le target-branch.
  # Minor + patch groupés, majeures une par une (une majeure peut dépasser ce que le reste de la
  # toolchain supporte : typescript 7 / jasmine-core 7 avaient cassé `npm ci`, #119). Versions épinglées
  # exactes dans package.json et Directory.Packages.props : Dependabot les met à jour telles quelles.
  - package-ecosystem: "nuget"
    directory: "/src/v2/back"
    target-branch: "env/staging"
    labels: ["dependencies", "refonte-v2"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      nuget-v2-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/src/v2/front/InSeconds.Client"
    target-branch: "env/staging"
    labels: ["dependencies", "refonte-v2"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      angular-v2:
        # @angular/* (dont le CDK et le service worker) et @ngrx/signals toujours ensemble, cf. piège 15
        # et PLAN § 6.2.
        patterns:
          - "@angular/*"
          - "@ngrx/signals"
        update-types:
          - "minor"
          - "patch"
      npm-v2-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@ngrx/signals"
        update-types:
          - "minor"
          - "patch"
