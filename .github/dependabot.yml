version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Les PR visent env/staging (testées au staging avant main), d'où le target-branch.
  # Minor + patch groupés, majeures une par une (une majeure peut dépasser ce que le reste de la
  # toolchain supporte : typescript 7 / jasmine-core 7 avaient cassé `npm ci`, #119). Versions épinglées
  # exactes dans package.json et Directory.Packages.props : Dependabot les met à jour telles quelles.
  - package-ecosystem: "nuget"
    directory: "/src/back"
    target-branch: "env/staging"
    labels: ["dependencies"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/src/front/InSeconds.Client"
    target-branch: "env/staging"
    labels: ["dependencies"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      angular:
        # @angular/* (dont le CDK et le service worker) et @ngrx/signals toujours ensemble, cf. piège 15.
        patterns:
          - "@angular/*"
          - "@ngrx/signals"
        update-types:
          - "minor"
          - "patch"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@ngrx/signals"
        update-types:
          - "minor"
          - "patch"
